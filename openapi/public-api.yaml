        in: path
        required: true
        description: 'NIF (company) the operation acts on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
    get:
      operationId: listCompanyPaymentConnections
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - payment-connections:read
      summary: List a NIF's payment connections
      description: |
        Lists the payment provider connections of a NIF (company) that your account
        **owns or manages**. Use it to check whether a NIF you provisioned has completed its
        connection.
      tags:
        - CompanyPaymentConnections
      responses:
        '200':
          description: Connections of the NIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListManagedPaymentConnectionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company). The same answer is given for a
            NIF that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/companies/{company_id}/payment-connections/authorizations:
    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) the authorization is opened for. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist.'
        schema:
          type: string
          format: uuid
    post:
      operationId: initiatePaymentConnection
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - payment-connections:write
      summary: Open an authorization to connect a payment provider
      description: |
        Opens an authorization session so the holder of a NIF (company) your platform **manages**
        can connect a payment provider (`stripe`), white-label by API.

        Returns an `authorization_url` where the holder authorizes the connection. After
        authorization, BeeL's callback finalizes the connection and redirects back to the
        `return_url` of your portal (if provided) with rich params (see `return_url`). The
        connection itself is created only once the holder authorizes, so it appears in
        `GET /v1/companies/{company_id}/payment-connections` afterwards, not before — which is why
        this is a sibling sub-resource and not a `POST` on the collection.

        The connection is sealed under the NIF's holder, so the auto-invoicing runs under the
        correct NIF.

        The NIF must be **activated in the mode of your API key** (`beel_sk_test_*` → Test,
        `beel_sk_live_*` → Live). Opening an authorization on a NIF that is not activated in that
        mode returns `400` with code `COMPANY_NOT_ACTIVATED_IN_ENVIRONMENT` and no
        `authorization_url`: activation is what creates the invoice series and tax configuration,
        so without it every incoming charge would be skipped instead of invoiced. Test and Live
        activations are independent — a NIF live in one mode still needs activating in the other.
      tags:
        - CompanyPaymentConnections
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentConnectionRequest'
      responses:
        '200':
          description: Authorization URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentConnectionResponse'
        '400':
          description: |
            The NIF is not activated in the mode of your API key
            (`COMPANY_NOT_ACTIVATED_IN_ENVIRONMENT`). Activate it in that mode and retry;
            no authorization is opened and no authorization URL is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company). No authorization is opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/companies/{company_id}/payment-connections/{provider}:
    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) the operation acts on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
      - name: provider
        in: path
        required: true
        description: |
          Payment provider slug in **lowercase**. Currently only `stripe` (Stripe Connect) is
          operative; `woocommerce` and `shopify` are reserved for future providers.
        schema:
          type: string
          enum:
            - stripe
    delete:
      operationId: disconnectCompanyPaymentConnection
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - payment-connections:write
      summary: Disconnect a NIF's payment provider
      description: |
        Disconnects the payment provider connection (`stripe`) of a NIF (company) that your
        account **owns or manages**. BeeL deletes the stored credentials and auto-invoicing stops
        at once: charges arriving afterwards are ignored and produce no invoice. Already-issued
        invoices are not affected.

        The authorization the holder granted at the provider is **not** revoked on the provider's
        side. To withdraw it, the holder must remove BeeL's access from the provider's own
        dashboard (in Stripe, *Settings → Connected applications*).
      tags:
        - CompanyPaymentConnections
      responses:
        '204':
          description: Connection disconnected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company). The same answer is given for a
            NIF that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The NIF has no connection for this `{provider}`. The `404` speaks of the connection
            named by the second path segment, never of the NIF: a NIF you cannot reach always
            answers `403`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/companies/{company_id}/payment-connections/{provider}/events:
    parameters:
      - $ref: '#/components/parameters/CompanyIdParam'
      - $ref: '#/components/parameters/ProviderParam'
    get:
      operationId: listCompanyPaymentEvents
      security:
