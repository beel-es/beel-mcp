      properties:
        status:
          type: string
          description: |
            Target status. `PAUSED` stops automatic generation keeping the schedule; `ACTIVE`
            resumes it and recalculates the next generation date from today.
          enum:
            - ACTIVE
            - PAUSED
          example: PAUSED
    CreateRecurringInvoiceRequest:
