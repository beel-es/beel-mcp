          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyData'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RepresentationActionResponse:
