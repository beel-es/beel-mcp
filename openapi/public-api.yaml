  /v1/invoices/{invoice_id}/pdf:
    get:
      tags:
        - InvoiceDelivery
      summary: Get invoice PDF download URL
      description: |
        **Deprecated.** Use `GET /v1/companies/{company_id}/invoices/{invoice_id}/pdf`, which behaves identically.
        This route keeps working until the date announced in its `Sunset` response header.

        Generates a temporary pre-signed URL to download the invoice PDF.

        **Security:**
        - URL expires automatically in 5 minutes
        - HMAC signature prevents tampering
        - Only allows download (GET), no modification

        **Benefits:**
        - Direct download from storage (bypasses backend)
        - Better performance and lower server load
        - Compatible with browser cache and CDN
        - Ideal for large files

        **Frontend usage:**
        ```javascript
        const response = await fetch('/v1/invoices/{invoice_id}/pdf');
        const { download_url } = await response.json();
        window.open(download_url, '_blank'); // Direct download
        ```

        **Format:** PDF is generated according to Spanish tax regulations.
      operationId: generateInvoicePdf
      x-successor:
        method: GET
        path: /v1/companies/{company_id}/invoices/{invoice_id}/pdf
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:read
      parameters:
        - name: invoice_id
          in: path
          required: true
          description: Invoice ID
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Download URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePdfResponse'
        '202':
          description: |
            The invoice exists but its PDF is still being generated asynchronously
            (PDFs are produced after emission, not synchronously). No body is returned.
            Poll this same endpoint until it responds `200` with the download URL.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
