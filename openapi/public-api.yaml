          example: Specialized technical consulting services in web development
        category:
          $ref: '#/components/schemas/ProductCategory'
        default_price:
          type: number
          minimum: 0
          multipleOf: 0.0001
          description: Suggested default price (optional)
          example: 85.5
        unit:
          type: string
          maxLength: 50
          description: Unit of measure (optional)
          example: hours
        main_tax:
          $ref: '#/components/schemas/TaxInfo'
        equivalence_surcharge_rate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: Equivalence surcharge percentage (optional)
          example: 5.2
        irpf_rate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: IRPF withholding percentage (optional)
          example: 15
        active:
          type: boolean
          description: Indicates whether the product is active
          example: true
        created_at:
          type: string
          format: date-time
          description: Creation date and time
          example: '2025-01-18T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Last update date and time
          example: '2025-01-18T15:45:30Z'
    ProductCategory:
      type: string
      enum:
        - PRODUCT
        - SERVICE
        - CONSULTING
        - SOFTWARE
        - TRAINING
        - OTHER
      description: |
        Product/service category:
        * PRODUCT - Physical, tangible products
        * SERVICE - General services
        * CONSULTING - Consulting and advisory services
        * SOFTWARE - Development, licenses, SaaS
        * TRAINING - Courses, workshops, training
        * OTHER - Other unclassified types
      example: CONSULTING
    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        code:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]*$
          nullable: true
          description: Unique alphanumeric product code (optional)
          example: SERV-001
        name:
          type: string
          maxLength: 255
          description: Product/service name
          example: Technical consulting
        description:
          type: string
          description: Detailed description (optional)
          example: Specialized technical consulting services
        category:
          $ref: '#/components/schemas/ProductCategory'
        default_price:
          type: number
          minimum: 0
          multipleOf: 0.0001
          description: Suggested default price (optional)
          example: 85.5
        unit:
          type: string
          maxLength: 50
          description: Unit of measure (optional)
          example: hours
        main_tax:
          $ref: '#/components/schemas/TaxInfo'
        equivalence_surcharge_rate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: |
            Equivalence surcharge percentage (optional).

            Must be coherent with `main_tax.regime_key`: a surcharge > 0 is
            only valid under regime `18`. When `regime_key` is omitted it is
            derived automatically (`18` with a surcharge > 0, `01` otherwise).
            An explicit `regime_key` that does not admit a surcharge combined
            with a surcharge > 0 is rejected with a 422
            (`SURCHARGE_REQUIRES_REGIME`), and an explicit regime `18` without
            a surcharge > 0 is rejected with a 422
            (`REGIME_REQUIRES_SURCHARGE`).
          example: 5.2
        irpf_rate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: IRPF withholding percentage (optional)
          example: 15
    UpdateProductRequest:
      type: object
      description: |
        Request to **replace** an existing product (`PUT`).

        Send the product complete: leaving out `main_tax`,
        `equivalence_surcharge_rate` or `irpf_rate` resets them to the creation
        defaults (IVA 21%, 0% and 0%), it does **not** keep the current values.
        To change a few fields and keep the rest untouched, use
        `PATCH /v1/products/{product_id}`.
      properties:
        code:
          type: string
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]*$
          nullable: true
          description: Unique alphanumeric product code (optional)
          example: SERV-001
        name:
          type: string
          maxLength: 255
          description: Product/service name
          example: Technical consulting
        description:
          type: string
          description: Detailed description (optional)
          example: Specialized technical consulting services
        category:
          $ref: '#/components/schemas/ProductCategory'
        default_price:
          type: number
          minimum: 0
          multipleOf: 0.0001
          description: Suggested default price (optional)
          example: 85.5
        unit:
          type: string
          maxLength: 50
          description: Unit of measure (optional)
          example: hours
        main_tax:
          $ref: '#/components/schemas/TaxInfo'
        equivalence_surcharge_rate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: |
            Equivalence surcharge percentage (optional).

            Must be coherent with `main_tax.regime_key`: a surcharge > 0 is
            only valid under regime `18`. When `regime_key` is omitted it is
            derived automatically (`18` with a surcharge > 0, `01` otherwise).
            An explicit `regime_key` that does not admit a surcharge combined
            with a surcharge > 0 is rejected with a 422
            (`SURCHARGE_REQUIRES_REGIME`), and an explicit regime `18` without
            a surcharge > 0 is rejected with a 422
            (`REGIME_REQUIRES_SURCHARGE`).
          example: 5.2
        irpf_rate:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: IRPF withholding percentage (optional)
          example: 15
        active:
          type: boolean
          description: Indicates whether the product is active
          example: true
    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Product'
    ProductsListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                pagination:
                  $ref: '#/components/schemas/Pagination'
    ProductQueryParams:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/ProductCategory'
        active:
          type: boolean
          description: Filter by active/inactive status
          example: true
        search:
          type: string
          maxLength: 100
          description: Search in name, description or code
          example: consulting
        page:
          type: integer
          minimum: 0
          default: 0
          description: Page number (0-indexed)
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Page size
          example: 20
    SeriesFormat:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Z0-9\-_/{}:]*$
      example: '{CODIGO}-{YYYY}-{NUM:4}'
      description: |
        Format template with available variables (UPPERCASE ONLY):
        - {CODIGO}: Series code (e.g., "FAC")
        - {YYYY}: Year with 4 digits (e.g., "2025")
        - {YY}: Year with 2 digits (e.g., "25")
        - {MM}: Month with 2 digits (e.g., "01")
        - {NUM}: Sequential number without padding (e.g., "1")
        - {NUM:X}: Sequential number with padding (e.g., {NUM:4} → "0001")

        **REQUIRED**: Must contain at least {NUM} or {NUM:X}
        **IMPORTANT**: Only uppercase (rejects {yy}, {mm}, {codigo}, etc.)

        Valid examples:
        - "{CODIGO}-{YYYY}-{NUM:4}" → "FAC-2025-0001"
        - "{CODIGO}/{NUM:6}" → "FAC/000001"
        - "{YYYY}{MM}-{NUM:3}" → "202501-001"
    CounterReset:
      type: string
      enum:
        - NEVER
        - ANNUAL
        - MONTHLY
      description: |
        Counter reset policy:
        - NEVER: Counter never resets (continuous numbering)
        - ANNUAL: Counter resets yearly
        - MONTHLY: Counter resets monthly
    SeriesCode:
      type: string
      pattern: ^[A-Z0-9\-_]{1,50}$
      minLength: 1
      maxLength: 50
      example: FAC
      description: |
        Alphanumeric series code (used in {CODIGO} variable).
        Allows uppercase letters, numbers, hyphens and underscores.
    VeriFactuConfiguration:
      type: object
      description: |
        VeriFactu configuration as resolved by the server. **Response only** — the update body is
        `UpdateVeriFactuConfigurationRequest`, which carries just `enabled` and `apply_by_default`.
      required:
        - enabled
        - apply_by_default
      properties:
        enabled:
          type: boolean
          default: false
          description: |
            Whether VeriFactu is enabled for this user.
            When enabled, the user can submit invoices to AEAT.
            Freelancers who don't need to submit invoices to AEAT can leave it disabled.
        apply_by_default:
          type: boolean
          default: false
          description: |
            Whether VeriFactu should be automatically applied to new invoices.
            Requires 'enabled' to be true.
        nif_status:
          type: string
          nullable: true
          enum:
            - PENDING
            - ACTIVATED
            - DEACTIVATED
            - ERROR
          description: |
            VeriFactu registration status (can be null if VeriFactu was never enabled):
            - PENDING: Initial registration in progress
            - ACTIVATED: NIF validated and user created in the corresponding environment
            - DEACTIVATED: Deactivated (data retained for 30 days)
            - ERROR: Some step of the process failed
        nif_registered_at:
          type: string
          format: date-time
          nullable: true
          description: Successful activation date in VeriFactu production
        status:
          type: string
          nullable: true
          enum:
            - DISABLED
            - UNSIGNED
            - NOT_ACTIVATED
            - ACTIVE
            - ERROR
          description: |
            Single derived VeriFactu state for the (NIF, environment) of the
            request — the ONE truth every UI surface (settings banner, activation
            card, invoice form) reads, so they can no longer contradict each other.
            Read-only; resolved server-side. Null only if never configured.
            - DISABLED: VeriFactu not enabled for this account.
            - UNSIGNED: enabled but the NIF has no signed AEAT representation.
            - NOT_ACTIVATED: signed, but no API key for the operating environment.
            - ACTIVE: signed and activated with API key: ready to submit.
            - ERROR: NIF activation failed.
        signed:
          type: boolean
          nullable: true
          description: |
            Secondary flag: whether the NIF has a signed AEAT representation
            (per-NIF, shared across environments). Data for the wizard, NOT the gate.
        activated:
          type: boolean
          nullable: true
          description: |
            Secondary flag: whether the NIF is activated (has an API key) in the
            operating environment (per-environment). Data, NOT the gate.
        pdf_generated:
          type: boolean
          nullable: true
          description: |
            Secondary flag: whether a representation PDF artifact exists. Used by
            the signature wizard as secondary data, NOT the source of truth of the gate.
    UpdateVeriFactuConfigurationRequest:
      type: object
      description: |
        Request body of `PUT /v1/configuration/verifactu`. Carries the **only two writable
        fields**; everything else in `VeriFactuConfiguration` is resolved server-side.

        Both are required and there is **no default**: this PUT replaces the whole state, so
        omitting a field is a client error, not a silent `false`. A `default:` here would be
        materialized in the generated DTO and would satisfy the `@NotNull` before validation
        could tell "not sent" from "sent as false" — which is how `{"apply_by_default": true}`
        used to turn VeriFactu off and answer 200 (BEE-868).
      required:
        - enabled
        - apply_by_default
      properties:
        enabled:
          type: boolean
          description: |
            Whether VeriFactu is enabled for this user.
            When enabled, the user can submit invoices to AEAT.
            Freelancers who don't need to submit invoices to AEAT can leave it disabled.
        apply_by_default:
          type: boolean
          description: |
            Whether VeriFactu should be automatically applied to new invoices.
            Requires 'enabled' to be true.
    TaxConfiguration:
      type: object
      required:
        - default_main_tax
        - apply_equivalence_surcharge
        - apply_irpf
      properties:
        default_main_tax:
          allOf:
            - $ref: '#/components/schemas/TaxInfo'
            - description: |
                Default main tax configuration for new invoices.
                Includes tax regime type (IVA/IGIC/IPSI/OTHER), percentage and regime key.

                Common examples:
                - Standard VAT: { type: "IVA", percentage: 21, regime_key: "01" }
                - Special Reduced IGIC: { type: "IGIC", percentage: 7, regime_key: "01" }
                - Standard IPSI: { type: "IPSI", percentage: 10, regime_key: "01" }
            - default:
                type: IVA
                percentage: 21
                regime_key: '01'
        default_exemption_reason:
          $ref: '#/components/schemas/ExemptionReason'
          nullable: true
        default_exemption_reason_text:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Custom exemption text. Only used when `default_exemption_reason` is `OTRO`,
            where it is mandatory — same rule as in the invoice line.
        apply_equivalence_surcharge:
          type: boolean
          default: false
          description: |
            Whether the freelancer is under the equivalence surcharge regime.

            **Business rule**: If `true`, the `default_equivalence_surcharge` field is REQUIRED.
        default_equivalence_surcharge:
          allOf:
            - $ref: '#/components/schemas/EquivalenceSurchargePercentage'
          description: |
            Default equivalence surcharge.

            **Business rule**: REQUIRED if `apply_equivalence_surcharge` is `true`.
        apply_irpf:
          type: boolean
          default: false
          description: |
            Whether IRPF withholding should be applied to invoices.

            Defaults to `false`: no withholding is applied until the user declares one
            (a rate nobody declared is never invented).

            **Business rule**: If `true` and `irpf_exempt` is `false`,
            the `default_irpf_rate` field is REQUIRED.
        default_irpf_rate:
          allOf:
            - $ref: '#/components/schemas/IrpfPercentage'
          description: |
            Default IRPF for new invoices.

            **Business rule**: REQUIRED if `apply_irpf` is `true` and `irpf_exempt` is `false`.
        irpf_exempt:
          type: boolean
          default: false
          description: |
            Whether the freelancer is exempt from IRPF withholding (e.g., business start).

            **Note**: When `true`, any provided `default_irpf_rate` is saved but not applied to invoices.
            This allows pre-configuring the rate for when the exemption ends.
        default_payment_method:
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'
          default: BANK_TRANSFER
          description: |
            Default payment method for new invoices.
            If NONE is selected, no payment information will be shown on the invoice.
        payment_term_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 365
          description: Default payment term in days (0-365). Null means no default term.
        proforma_validity_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 365
          description: |
            Default validity term in days for new proformas (0-365). Null means no default:
            proformas are created without an expiry date.

            UI-only default: the dashboard uses it to prefill `valid_until` when creating a
            proforma (issue date + N days, editable). It is never applied server-side, so the
            public API contract of `valid_until` does not change.
    InvoiceSeries:
      type: object
      required:
        - id
        - name
        - code
        - format
        - counter_reset
        - active
        - default_series
        - document_type
      properties:
        id:
          type: string
          format: uuid
          description: Unique series ID
        company_id:
          type: string
          format: uuid
          description: |
            Company (tax ID) the series belongs to. A listing is always scoped to one company —
            the one in the path, or the one in focus for the legacy flat route — so this field
            restates which one, it does not mix several.
        document_type:
          $ref: '#/components/schemas/DocumentType'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Main Series
          description: Descriptive name of the series
        code:
          $ref: '#/components/schemas/SeriesCode'
        description:
          type: string
          maxLength: 1000
          example: Series for standard invoices
          description: Optional series description
        format:
          $ref: '#/components/schemas/SeriesFormat'
        counter_reset:
          $ref: '#/components/schemas/CounterReset'
        initial_number:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999
          default: 1
          example: 1
          description: |
            Initial number configured for this series counter.
            Defines from which number invoice numbering will start.
        active:
          type: boolean
          default: true
          description: Indicates whether the series is active
        default_series:
          type: boolean
          default: false
          description: Indicates whether this is the user's default series (only one can be)
        numbering_locked:
          type: boolean
          readOnly: true
          description: |
            `true` once this series has issued at least one invoice. From that point the
            fields that drive numbering (`code`, `format`, `counter_reset`, `initial_number`)
            are permanently locked and any attempt to change them is rejected — numbering can
            only be adjusted **before** the first invoice of a series. Cosmetic fields
            (`name`, `description`) remain editable. To use a different numbering, create a
            new series.
        created_at:
          type: string
          format: date-time
          description: Creation date
        next_number:
          type: integer
          format: int64
          readOnly: true
          description: Next invoice number that will be assigned for this series
        updated_at:
          type: string
          format: date-time
          description: Last update date
    TaxRegime:
      type: object
      required:
        - code
        - name
        - description
        - tax_rates
        - applies_equivalence_surcharge
        - regime_keys
      properties:
        code:
          type: string
          description: Tax regime code
          enum:
            - IVA
            - IGIC
            - IPSI
            - OTHER
          example: IVA
        name:
          type: string
          description: Tax regime name
          example: IVA
        description:
          type: string
          description: Detailed description of the tax regime
          example: Value Added Tax
        tax_rates:
          type: array
          items:
            $ref: '#/components/schemas/TaxPercentage'
          description: Available percentages in this regime
        applies_equivalence_surcharge:
          type: boolean
          description: Whether this regime applies equivalence surcharge
        regime_keys:
          type: array
          items:
            $ref: '#/components/schemas/VeriFactuRegimeKey'
          description: Valid VeriFactu regime keys for this tax type
    VeriFactuRegimeKey:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: VeriFactu regime code
          pattern: ^[0-9]{2}$
          example: '01'
        description:
          type: string
          description: Regime key description
          example: General regime operation
    TaxPercentage:
      type: object
      required:
        - percentage
        - description
        - active
      properties:
        percentage:
          type: number
          description: Tax percentage
          example: 21
        description:
          type: string
          description: Tax type description
          example: IVA (21%)
        active:
          type: boolean
          description: Indicates whether the type is active
          default: true
        associated_equivalence_surcharge:
          type: number
          description: Associated equivalence surcharge percentage (only for VAT)
          minimum: 0
          example: 5.2
          nullable: true
    VatType:
      type: object
      required:
        - percentage
        - description
        - verifactu_code
        - active
      properties:
        percentage:
          type: number
          description: VAT percentage
          example: 21
        description:
          type: string
          description: VAT type description
          example: IVA General (21%)
        verifactu_code:
          type: string
          description: VAT type code according to VeriFactu regulations
          example: S1
        active:
          type: boolean
          description: Whether the VAT type is active
          default: true
    IrpfType:
      type: object
      required:
        - percentage
        - description
        - active
      properties:
        percentage:
          type: number
          description: IRPF withholding percentage
          example: 15
        description:
          type: string
          description: IRPF type description
          example: IRPF Profesional (15%)
        active:
          type: boolean
          description: Whether the IRPF type is active
          default: true
    EquivalenceSurcharge:
      type: object
      required:
        - percentage
        - associated_vat
        - description
        - active
      properties:
        percentage:
          type: number
          description: Equivalence surcharge percentage
          example: 5.2
        associated_vat:
          type: number
          description: VAT percentage to which this surcharge is associated
          example: 21
        description:
          type: string
          description: Equivalence surcharge description
          example: RE 5.2% (IVA 21%)
        active:
          type: boolean
          description: Whether the surcharge is active
          default: true
    CreateSeriesRequest:
      type: object
      required:
        - name
        - code
        - format
        - counter_reset
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentType'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Main Series
          description: Descriptive name of the series
        code:
          $ref: '#/components/schemas/SeriesCode'
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Series for standard invoices
          description: Optional series description
        format:
          $ref: '#/components/schemas/SeriesFormat'
        counter_reset:
          allOf:
            - $ref: '#/components/schemas/CounterReset'
          default: ANNUAL
          description: |
            When this series' counter resets. Defaults to `ANNUAL` when omitted — so a format
            without a year token must come with `counter_reset: NEVER`.
        initial_number:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999
          default: 1
          example: 1
          description: |
            Initial number for this series counter.
            Useful when migrating from another system and wanting to continue existing numbering.
            For example, if the last invoices were 2024-0150, you can set initial_number=151.
            Default value is 1.
        active:
          type: boolean
          default: true
          description: Whether the series is active
        default_series:
          type: boolean
          default: false
          description: |
            Whether this is the default series for its document_type.

            **Auto-promotion:** the domain guarantees that, while at least one
            series exists for a given `(document_type, environment)`, exactly one
            of them is the default. So if you create the **first** series of a
            `document_type` (no default exists yet for that type and environment),
            it is marked as default **even if you send `false`** — the response
            will then return `default_series: true`. Send `true` to also unmark
            the current default of that type.
    UpdateSeriesRequest:
      type: object
      description: |
        Request to **replace** an invoice series (`PUT`).

        **IMPORTANT:** the fields that drive numbering (`code`, `format`, `counter_reset`,
        `initial_number`) can only be modified while the series **has NO associated
        invoices**; the rest (`name`, `description`, `active`, `default_series`,
        `document_type`) can always be changed.

        To change a few fields and keep the rest untouched — or to clear the description —
        use `PATCH /v1/configuration/series/{series_id}`.
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentType'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Main Series
          description: Descriptive name of the series
        code:
          $ref: '#/components/schemas/SeriesCode'
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Series for standard invoices
          description: Optional series description
        format:
          $ref: '#/components/schemas/SeriesFormat'
        counter_reset:
          $ref: '#/components/schemas/CounterReset'
        initial_number:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999
          example: 54
          description: |
            Initial number for this series counter.
            Useful for adjusting numbering or resetting the counter.
            For example, if you want the next invoice to be 2025-0054, set initial_number=54.
        active:
          type: boolean
          description: |
            Whether the series is active.

            **Restriction:** A default series cannot be deactivated
            (another must be set as default first).
        default_series:
          type: boolean
          description: |
            Whether this is the default series.

            **Restriction:** An inactive series cannot be marked as default.
    UpdateTaxConfigurationRequest:
      type: object
      properties:
        default_main_tax:
          allOf:
            - $ref: '#/components/schemas/TaxInfo'
          description: |
            Default main tax configuration.
            If provided, completely replaces the current configuration.

            It travels together with `default_exemption_reason`: sending the tax without a
            reason clears the stored one (going back from 0% to 21% cannot leave an orphan
            "art. 20 exempt" behind), and sending only the reason applies it to the tax
            already stored. Sending neither leaves the current declaration untouched.
        default_exemption_reason:
          $ref: '#/components/schemas/ExemptionReason'
          nullable: true
        default_exemption_reason_text:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Custom exemption text, mandatory when `default_exemption_reason` is `OTRO`.

            Only `EXENTA_ART_20` and `OTRO` can be declared as a default — the reasons a
            NIF can verify on its own. The rest depend on the recipient, the operation or
            the regime, so they are declared per invoice line; sending one returns 422.
            A 0% VAT/IPSI without a reason is also rejected with 422: in those taxes 0% is
            not a rate, it is the sentinel of an operation carrying no tax.
        apply_equivalence_surcharge:
          type: boolean
          description: |
            Whether the freelancer is under the equivalence surcharge regime.

            Omit it to leave the current value untouched. On creation, omitting it means `false`.
        default_equivalence_surcharge:
          $ref: '#/components/schemas/EquivalenceSurchargePercentage'
        apply_irpf:
          type: boolean
          description: |
            Whether IRPF withholding should be applied.

            Omit it to leave the current value untouched. On creation, omitting it means `false`:
            a withholding nobody declared is not applied.
        default_irpf_rate:
          $ref: '#/components/schemas/IrpfPercentage'
        irpf_exempt:
          type: boolean
          description: |
            Whether the freelancer is exempt from IRPF withholding.

            Omit it to leave the current value untouched. On creation, omitting it means `false`.
        default_payment_method:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'
          description: |
            Default payment method for new invoices.
            If NONE is selected, no payment information will be shown on the invoice.
        payment_term_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 365
          description: Default payment term in days (0-365)
        proforma_validity_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 365
          description: |
            Default validity term in days for new proformas (0-365).
            Send `null` to clear it (proformas stop getting a prefilled expiry date).
    ValidateNifRequest:
      type: object
      required:
        - nif
      properties:
        nif:
          allOf:
            - $ref: '#/components/schemas/NIF'
            - description: |
                NIF/CIF to validate against the AEAT census.
                Must be 9 alphanumeric characters.
        legal_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: |
            Last name and first name (individual) or business name (legal entity).

            **Important**:
            - REQUIRED for individuals (NIFs starting with a number)
            - OPTIONAL for legal entities (NIFs starting with a letter)

            For an **individual**, AEAT matches NIF and name together: send a name the
            census does not recognise and the person is not identified, so the status
            comes back `INVALID`.

            For a **legal entity**, the name is **not verified**. AEAT identifies a
            company by its CIF alone — there is no census answer meaning "this name is
            wrong", so validation depends only on the CIF and any name you send is
            accepted. Use the `legal_name` of the response to contrast your own.
          example: JUAN PEREZ GARCIA
    ValidateNifResponse:
      type: object
      required:
        - valid
        - status
        - message
      properties:
        valid:
          type: boolean
          description: |
            true if the NIF is in the AEAT census, **is active**, and — for an
            individual — the name matches (status = VALID). false otherwise.

            For a legal entity the name is **not verified**: AEAT identifies a
            company by its CIF alone, so `valid: true` says nothing about the name
            you sent. See `legal_name_verified`.

            Being in the census is not enough: a deregistered or revoked NIF comes
            back `false`. Read `census_status` to tell those apart from a NIF that
            is simply not registered, because they are not fixed the same way.

            A **deregistered** NIF cannot issue invoices, but it can still receive
            them — a company closing down does not stop you from invoicing what
            accrued before it closed, and BeeL still accepts it as a recipient. A
            **revoked** NIF cannot operate at all: it is rejected on both sides.
          example: true
        status:
          allOf:
            - $ref: '#/components/schemas/NifValidationStatus'
            - description: Validation status
        legal_name:
          type: string
          nullable: true
          description: |
            Legal name as it appears in the AEAT census — never an echo of the name
            you sent. Only available if status = VALID.

            For a legal entity this is the only signal that your own name is wrong,
            since the one you send is not checked: comparing the two is up to you.

            Deliberately withheld when an individual is not identified because the
            name you sent is close but wrong (`census_status` =
            `NOT_IDENTIFIED_SIMILAR`). AEAT does return the real name there, but
            you have just shown you do not know it.
          example: JUAN PEREZ GARCIA
        legal_name_verified:
          type: boolean
          description: |
            Whether AEAT actually cross-checked the `legal_name` you sent.

            `true` only for an **individual** that was identified: AEAT matches NIF
            and name together there, so an identification is the check having
            passed.

            Always `false` for a **legal entity** — its name is **not verified**.
            AEAT identifies a company by its CIF alone and returns the census name
            without looking at the one you sent, so `valid: true` says nothing about
            your name. Comparing it against `legal_name` is up to you.

            Also `false` whenever the census was not reached at all (`PENDING`,
            `ERROR`, or a syntactically invalid NIF).
          example: false
        census_status:
          allOf:
            - $ref: '#/components/schemas/CensusStatus'
            - description: |
                Census situation AEAT reported for this NIF. Absent when the census
                was not reached (`PENDING`, `ERROR`, or a syntactically invalid NIF)
                — absent is not "not registered".
          example: IDENTIFIED
        message:
          type: string
          description: |
            Descriptive message of the validation result.

            Examples:
            - VALID: "NIF successfully validated against the AEAT census"
            - INVALID: "NIF does not exist in the AEAT census"
            - PENDING: "NIF validation is pending. The system will automatically validate it when the service is available."
            - ERROR: "Error validating NIF: VeriFactu API timeout"
          example: NIF successfully validated against the AEAT census
        validated_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp of when the NIF was successfully validated.
            Only available if status = VALID.
          example: '2025-01-15T10:30:00Z'
    InvoiceTemplateOption:
      type: object
      required:
        - code
        - name
        - description
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/InvoiceTemplateType'
          description: The value to send as `template_type`.
          example: MODERN_TABLE
        name:
          type: string
          description: Template name, translated. Meant to be shown to a person.
          example: Modern Table
        description:
          type: string
          description: What the template is suited to, translated. One or two sentences.
          example: Structured table design, suited to standard products and services with several lines.
    InvoiceCustomizationOptionsResponse:
      type: object
      required:
        - template_types
      properties:
        template_types:
          type: array
          description: Templates available to render the invoices of a NIF.
          items:
            $ref: '#/components/schemas/InvoiceTemplateOption'
    TaxType:
      type: string
      enum:
        - IVA
        - IGIC
        - IPSI
        - OTHER
      description: |
        Tax type by territory:
        - IVA: Iberian Peninsula and Balearic Islands (0%, 4%, 10%, 21%)
        - IGIC: Canary Islands (0%, 3%, 5%, 7%, 9.5%, 15%, 20%)
        - IPSI: Ceuta and Melilla (0.5%, 1%, 2%, 4%, 8%, 10%)
        - OTHER: Configurable 0%-100%
      example: IVA
    RegimeKey:
      type: string
      enum:
        - '01'
        - '02'
        - '03'
        - '04'
        - '05'
        - '06'
        - '07'
        - '08'
        - '09'
        - '10'
        - '11'
        - '14'
        - '15'
        - '17'
        - '18'
        - '19'
        - '20'
      description: |
        Regime key according to VeriFactu regulations. Omitted, `01` (general regime) applies:
        - 01: General regime operation
        - 02: Export
        - 03: Used goods, art, antiques
        - 04: Investment gold
        - 05: Travel agencies
        - 06: Group of entities
        - 07: Cash basis
        - 08: IPSI/IVA/IGIC operations
        - 09: Mediating agencies
        - 10: Third-party collections
        - 11: Local rental
        - 14: VAT pending in certifications
        - 15: VAT pending successive tract
        - 17: OSS and IOSS
        - 18: Equivalence surcharge
        - 19: REAGYP
        - 20: Simplified regime
      example: '01'
    TaxInfo:
      type: object
      required:
        - type
        - percentage
      properties:
        type:
          $ref: '#/components/schemas/TaxType'
        percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Tax percentage
          example: 21
        regime_key:
          $ref: '#/components/schemas/RegimeKey'
      description: |
        Complete tax information with cross-validations:
        - IVA: only percentages 0, 4, 10, 21
        - IGIC: only percentages 0, 3, 5, 7, 9.5, 15, 20
        - IPSI: only percentages 0.5, 1, 2, 4, 8, 10
        - OTHER: any percentage between 0 and 100

        Exception: when regime_key = "17" (OSS/IOSS) the invoice applies the destination
        country VAT instead of the Spanish one, so any percentage in the EU range [0, 27]
        is accepted regardless of the tax type set.
      example:
        type: IVA
        percentage: 21
        regime_key: '01'
    IgicPercentage:
      type: number
      description: |
        Applied IGIC percentage.
        Valid value validation is performed in the backend according to the configured tax regime.
        Common IGIC values (Canary Islands):
        - 0%: Exempt
        - 3%: Reduced
        - 5%: Special reduced (energy drinks)
        - 7%: Standard
        - 9.5%: Increased
        - 15%: Higher increased
        - 20%: Special
      minimum: 0
      maximum: 100
      example: 7
    IpsiPercentage:
      type: number
      description: |
        Applied IPSI percentage.
        Valid value validation is performed in the backend according to the configured tax regime.
        Common IPSI values (Ceuta and Melilla):
        - 0.5%: Super-reduced (social housing, games, advertising)
        - 1%: Reduced (taxis, bars, electricity)
        - 2%: Intermediate (restaurants, hospitality)
        - 4%: Medium (renovations, real estate)
        - 8%: High (telecommunications, electronic services)
        - 10%: Standard (construction)
      minimum: 0
      maximum: 100
      example: 10
    OtherTaxPercentage:
      type: number
      minimum: 0
      maximum: 100
      description: |
        Customizable percentage for OTHER.
        Allows any value between 0% and 100%.
      example: 5
    CustomerValidationUnifiedResult:
      type: object
      required:
        - metadata
        - customers_validation
        - statistics
      description: |
        Unified format for customer validation results.
        Used for bulk validation (JSON), CSV import and Holded Excel import.

        Combines the functionality of CrearClientesBulk200Response, CsvImportPreviewResult
        and HoldedImportResult into a consistent structure that simplifies the frontend.
      properties:
        metadata:
          $ref: '#/components/schemas/CustomerValidationMetadata'
        customers_validation:
          type: array
          items:
            $ref: '#/components/schemas/CustomerValidationItem'
          description: List of processed customers with their validation status
        statistics:
          $ref: '#/components/schemas/CustomerValidationStatistics'
    CustomerValidationMetadata:
      type: object
      required:
        - total_customers
        - is_dry_run
        - processing_time_ms
        - source_type
      description: |
        Metadata about the validation operation.
        Compatible with bulk JSON, CSV import and Holded Excel import.
      properties:
        total_customers:
          type: integer
          description: Total number of customers submitted
          example: 10
        is_dry_run:
          type: boolean
          description: Whether it was validation (true) or import (false)
          example: true
        processing_time_ms:
          type: integer
          description: Processing time in milliseconds
          example: 450
        source_type:
          type: string
          enum:
            - BULK_JSON
            - CSV_IMPORT
            - HOLDED_EXCEL
          description: |
            Data source type:
            - BULK_JSON: Data sent as JSON to bulk endpoint
            - CSV_IMPORT: Data parsed from CSV file
            - HOLDED_EXCEL: Data parsed from Holded Excel file
          example: CSV_IMPORT
        filename:
          type: string
          nullable: true
          description: File name (CSV or Excel depending on source_type)
          example: clientes_enero.csv
        file_size_bytes:
          type: integer
          nullable: true
          description: File size in bytes
          example: 1048576
        total_rows:
          type: integer
          nullable: true
          description: Total file rows excluding headers
          example: 250
    CustomerValidationItem:
      type: object
      required:
        - index
        - customer
        - status
        - errors
        - warnings
      description: |
        Individual customer validation result.
        Works for bulk JSON, CSV import and Holded Excel import.
      properties:
        index:
          type: integer
          description: |
            Customer index in the submitted list (0-based for bulk, 1-based for files).
            For CSV/Excel, represents the row number in the file.
          example: 0
        customer:
          allOf:
            - $ref: '#/components/schemas/Customer'
          description: |
            Parsed and validated customer.
            Can be null if there were critical parsing errors.
        status:
          type: string
          enum:
            - VALID
            - WARNING
            - ERROR
            - DUPLICATE
            - NIF_INVALID
          description: |
            Customer validation status:
            - VALID: Completely valid customer
            - WARNING: Valid customer but with non-critical warnings
            - ERROR: Invalid customer, cannot be processed
            - DUPLICATE: Duplicate customer (in batch/CSV or database)
            - NIF_INVALID: NIF not valid according to AEAT census (VeriFactu)
          example: VALID
        errors:
          type: array
          description: List of errors found (block import)
          items:
            $ref: '#/components/schemas/CustomerValidationError'
        warnings:
          type: array
          description: List of warnings (do not block import)
          items:
            $ref: '#/components/schemas/CustomerValidationWarning'
        row_number:
          type: integer
          nullable: true
          description: Row number in the file (CSV or Excel depending on source_type)
          example: 15
    CustomerValidationError:
      type: object
      required:
        - field
        - value
        - message
      description: Field-specific validation error
      properties:
        field:
          type: string
          description: Field that failed validation
          example: nif
        value:
          type: string
          description: Value that caused the error
          example: 12345678X
        message:
          type: string
          description: Error explanatory message
          example: NIF not found in AEAT census
    CustomerValidationWarning:
      type: object
      required:
        - field
        - message
      description: Validation warning (does not block import)
      properties:
        field:
          type: string
          description: Field with warning
          example: email
        message:
          type: string
          description: Warning message
          example: Email not provided, NIF will be used for invoicing
    CustomerValidationStatistics:
      type: object
      required:
        - total_processed
        - valid
        - with_warnings
        - with_errors
        - duplicates
        - invalid_nifs
        - imported
        - success_rate
      description: |
        Aggregated validation statistics.
        Compatible with all source types (bulk JSON, CSV and Holded Excel).

        Every field except `imported` counts rows of the submitted file/payload, classified by
        outcome: each row falls into exactly one of `valid`, `with_warnings`, `with_errors`,
        `duplicates` and `invalid_nifs`, so those five add up to `total_processed`.
        `imported` is the only field that counts writes to the database, so it is the field to
        read to know whether an import worked.
      properties:
        total_processed:
          type: integer
          description: Total customers processed
          example: 10
        valid:
          type: integer
          description: Completely valid customers (no warnings or errors)
          example: 6
        with_warnings:
          type: integer
          description: Valid customers but with warnings
          example: 2
        with_errors:
          type: integer
          description: Customers with errors (not importable)
          example: 2
        duplicates:
          type: integer
          description: Customers with duplicate NIFs
          example: 1
        invalid_nifs:
          type: integer
          description: Customers with NIFs not valid in AEAT
          example: 1
        imported:
          type: integer
          description: |
            Customers actually created in the database by this request.
            Always `0` when `is_dry_run=true` (a preview writes nothing). On a real import it is
            the number of rows that reached the database — normally `importable`, and lower when a
            row was rejected on write (it is then reported under `duplicates` or `with_errors`).
          example: 8
        success_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Success rate (valid + with_warnings) / total_processed
          example: 0.8
        importable:
          type: integer
          description: Total customers that can be imported (valid + with_warnings)
          example: 8
        not_importable:
          type: integer
          description: Total customers that CANNOT be imported (with_errors + duplicates + invalid_nifs)
          example: 2
