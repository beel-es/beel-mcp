  /v1/nif/validate:
    post:
      tags:
        - NIF
      summary: Validate NIF against AEAT registry
      description: |
        **Public endpoint** to validate a NIF/CIF against the AEAT registry using VeriFactu.

        This endpoint is useful for:
        - Pre-validation before registration (proactive feedback)
        - Validating customer NIFs before creating invoices
        - Verifying that a NIF exists in the registry

        **Behavior:**
        - **VALID**: The NIF exists in the AEAT registry. Returns the fiscal name.
        - **INVALID**: The NIF has correct format but doesn't exist in the registry.
        - **PENDING**: VeriFactu API is temporarily unavailable. The NIF has valid syntax but couldn't be verified against the registry.
        - **ERROR**: Technical error during validation (invalid syntax, timeout, etc.)

        **What `valid: true` does and does not tell you:**
        For an individual it means AEAT matched NIF and name together. For a legal
        entity the name you sent is **not verified** at all — AEAT identifies a
        company by its CIF alone — so `valid: true` says nothing about your name.
        `legal_name_verified` tells the two cases apart, and `census_status` says
        whether an identified NIF is also deregistered or revoked.

        **Note about PENDING:**
        If you use this endpoint for pre-validation during registration, a PENDING status
        indicates that the NIF has valid format and the user can continue. The system
        will validate the NIF automatically when the service becomes available.

        **Authentication:**
        This endpoint accepts both API Keys and Session Cookies.
      operationId: validateNif
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - nif:validate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateNifRequest'
            example:
              nif: B12345678
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ValidateNifResponse'
              examples:
                valid:
                  summary: Valid NIF (individual, name cross-checked)
                  value:
                    success: true
                    data:
                      valid: true
                      status: VALID
                      legal_name: JUAN PEREZ GARCIA
                      legal_name_verified: true
                      census_status: IDENTIFIED
                      message: NIF successfully validated in AEAT registry
                      validated_at: '2025-01-15T10:30:00Z'
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                company:
                  summary: Valid CIF (legal entity, name NOT cross-checked)
                  description: |
                    The name sent was "PATATA FRITA SL" and the response is still
                    valid: AEAT identified the company by its CIF alone.
                    `legal_name_verified: false` says so, and `legal_name` is the
                    census one for you to compare against.
                  value:
                    success: true
                    data:
                      valid: true
                      status: VALID
                      legal_name: MERCADONA SA
                      legal_name_verified: false
                      census_status: IDENTIFIED
                      message: NIF successfully validated in AEAT registry
                      validated_at: '2025-01-15T10:30:00Z'
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                invalid:
                  summary: Invalid NIF (not in AEAT registry)
                  value:
                    success: true
                    data:
                      valid: false
                      status: INVALID
                      legal_name: null
                      legal_name_verified: false
                      census_status: NOT_IDENTIFIED
                      message: NIF does not exist in AEAT registry
                      validated_at: null
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                revoked:
                  summary: Revoked NIF (in the registry, but revoked by the AEAT)
                  description: |
                    A revoked NIF was annulled by the AEAT and published in the BOE: it cannot
                    operate, so it is not valid on either side of an invoice. Issuing to it hurts
                    both parties, since the recipient cannot deduct anything.
                  value:
                    success: true
                    data:
                      valid: false
                      status: INVALID
                      legal_name: null
                      legal_name_verified: false
                      census_status: IDENTIFIED_REVOKED
                      message: The NIF has been revoked by the AEAT and cannot operate
                      validated_at: null
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                deregistered:
                  summary: Deregistered NIF (in the registry, but no longer active)
                  description: |
                    A deregistered NIF is not active, so it is not valid: it cannot issue invoices.
                    It can still *receive* them, though — a company closing down does not stop you
                    from invoicing what accrued before it closed. Use `census_status` to tell this
                    case apart from a NIF that simply is not in the registry.
                  value:
                    success: true
                    data:
                      valid: false
                      status: INVALID
                      legal_name: null
                      legal_name_verified: false
                      census_status: IDENTIFIED_DEREGISTERED
                      message: The NIF is deregistered in the AEAT registry and cannot issue invoices
                      validated_at: null
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                pending:
                  summary: VeriFactu API unavailable (validation pending)
                  value:
                    success: true
                    data:
                      valid: false
                      status: PENDING
                      legal_name: null
                      legal_name_verified: false
                      message: NIF validation is pending. The system will validate it automatically when the service is available.
                      validated_at: null
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/companies:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Your own account, or an account you provisioned. It — not the credential — decides which account the operation acts on; a `403` is returned when you do not reach it, the same response an account that does not exist gets.
        schema:
          type: string
          format: uuid
    post:
      operationId: createCompany
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      summary: Create a company
      description: |
        Creates a new NIF/company under the authenticated account.
        Invoice series are created automatically with default values.

        This endpoint only **creates**. A NIF that already exists in your account returns `409`
        with `error.code=NIF_ALREADY_REGISTERED` and the existing `error.details.company_id` —
        it is never turned into a silent environment activation on the existing company. Switching
        an environment on for a company you already have is a separate act (explicit confirmation
        in Live, and it is what gets billed): `POST /v1/companies/{company_id}/activations`.

        Send `activate: false` to create only the NIF profile, without switching it on anywhere —
        no series, no charge, nothing to undo. Otherwise the `aeat_environment` field decides the
        creation flow:

        * **`TEST`** — created immediately, free. `201` + `CompanyCreatedData`.
        * **`PROD` + account already production-active** (billing set up) —
          created immediately as a production NIF. Real
          emission stays blocked until the AEAT representation is signed for
          this NIF. `201` + `CompanyCreatedData`.
        * **`PROD` + account with no card on file** — no company is created.
          Returns `402` with `error.code=CHECKOUT_REQUIRED` and **no checkout
          URL**: this endpoint never starts a charge (a production charge always
          hangs off activating an existing, user-signalled company in Live), and
          an API key has no browser to return from a checkout with. Create the
          company (with `activate: false`, or in `TEST`) and activate it in Live
          via `POST /v1/companies/{company_id}/activations`.
        * **`PROD` + account past due** — no company is created. Returns `402`
          with `error.code=PAYMENT_REQUIRED`. Nothing to sign up for here: the
          outstanding invoice has to be settled first.

        The company is created under the account the request resolves to — your own account, or the
        account the `BeeL-Active-Company` header points at when you manage it. The NIF is always
        registered in the name of that account's holder, never in the name of the caller. An account
        provisioned for someone who has not signed in yet already has a holder, so companies can be
        created for it right away.
      tags:
        - PublicCompanies
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse201'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: |
            Payment required before creating a production NIF. No company is created and no
            checkout is opened. Two distinct reasons, so branch on `error.code`:

            * `CHECKOUT_REQUIRED` — the account has **no card on file**. Nothing is owed; billing
              simply has not been set up. It gets set up by activating a company in Live.
            * `PAYMENT_REQUIRED` — the account has billing but is **past due**. The outstanding
              invoice must be settled; no new checkout is opened for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredResponse'
        '403':
          description: |
            You do not reach the account this request resolves to (the `BeeL-Active-Company` header
            points at a company you neither own nor manage with write access). Account existence is
            never disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The NIF cannot be created. Two distinct reasons, so branch on `error.code`:

            * `NIF_ALREADY_REGISTERED` — the NIF **already exists in your account**. Creating is
              done; switching an environment on for it is a different act and has its own endpoint:
              `POST /v1/companies/{company_id}/activations`. The existing
              company's id travels in `error.details.company_id`, so no lookup is needed to call it.
            * `NIF_PROD_ALREADY_ACTIVE_IN_ANOTHER_ACCOUNT` — the NIF is live in **another
              account**. A NIF can only issue in production from one account (tax rule).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: NIF_ALREADY_REGISTERED
                  message: This NIF is already registered in your account
                  details:
                    company_id: 9c8f1f2e-2b7a-4a1e-9d1f-3f5a8c2b7e10
                meta:
                  timestamp: '2025-01-15T10:30:00Z'
                  request_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listCompanies
      tags:
        - PublicCompanies
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
        - OAuth2:
            - companies:list
      summary: List the companies (NIFs) of an account (paginated)
      description: |
        Returns a server-side page of the companies (NIFs) that belong to the given account,
        optionally filtered by `search` (NIF / legal name / trade name). Always paginated — it
        scales to thousands of NIFs, so there is no full-list mode. The primary company comes
        first; the `pagination` block carries the totals.

        `account_id` may be your own account or an account you provisioned. `POST /v1/accounts`
        returns `company_id` once, at creation; this endpoint is how you get it back afterwards,
        and the only way to reach an account provisioned without a `tax_profile` whose holder
        registered their NIF later. An account with no NIF yet returns an empty page, not an error.

        The invoice series of each company are not part of this response: read them from
        `GET /v1/configuration/series` with the company in focus.

        Requires the `companies:list` scope. Over an account you provisioned it additionally
        requires an `access_level` other than `NONE`. A `403` is returned when you do not reach the
        account and when it does not exist; the two are not distinguished, so account existence is
        never disclosed. Under `{company_id}` the pair must be coherent: a NIF you reach but that hangs
        from a different account returns `404`; one you do not reach at all returns `403`, like the
        account itself.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          required: false
          description: Case-insensitive filter on NIF, legal name or trade name. Blank/omitted returns all.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Include derived data. `readiness` adds each company's issuing-readiness status.
          schema:
            $ref: '#/components/schemas/CompanyInclude'
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCompanies200Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The request does not resolve an account you reach (no active account, or the
            `BeeL-Active-Company` header points at a company you neither own nor manage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/companies/stats:
    parameters:
      - name: account_id
        in: path
