      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceBatchRequest'
      responses:
        '200':
          description: Batch completed (may include partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
        '400':
          $ref: '#/components/responses/InvalidJsonFormat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold the required
            access over it. A NIF that does not exist answers the same way.
