    patch:
      operationId: patchCompanyCustomer
      tags:
        - CompanyCustomers
      summary: Update a customer of a company partially
      description: |
        Updates only the fields present in the body, leaving every other field of the customer as it
        is. A field sent as `null` is cleared, which is different from omitting it (see
        `PatchCustomerRequest`).

        This is the canonical way to edit a customer. There is no `PUT` of full replacement under
        the company: replacing and patching are different shapes — the replacement clears the fields
        you omit — and different shapes do not share one operation.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - customers:write
      requestBody:
        required: true
        content:
