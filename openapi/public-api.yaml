      tags:
        - CompanyInvoiceDelivery
      summary: Download the PDFs of several invoices as a ZIP
      description: |
        Returns a single ZIP with the PDFs of the requested invoices of this company.

        **Partial success:** invoices whose PDF is not available are reported in the
        `X-Bulk-*` headers and left out of the archive. If none is available the call fails.
      security:
        - ApiKeyAuth: []
