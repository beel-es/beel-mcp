      callbacks:
        webhookEvent:
          '{$request.body#/url}':
            post:
              summary: Webhook event delivered to your endpoint
              description: |
                BeeL. sends HTTP POST to your URL when a subscribed event occurs.
                Your endpoint must respond with HTTP 2xx within 10 seconds.
                Failed deliveries are retried up to 5 times with exponential backoff.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
