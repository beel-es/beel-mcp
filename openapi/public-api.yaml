        payment_swift:
          type: string
          nullable: true
        payment_term_days:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        verifactu_enabled:
          type: boolean
          description: |
            Whether the invoices generated by this template carry VeriFactu information.

            **If omitted, the company's declared preference applies** (the
            "apply VeriFactu by default" setting, `apply_by_default`). If the company
            has no VeriFactu configuration, it resolves to `false`.
            Send the field explicitly (`true` or `false`) to override the preference.

            The resolved value is **frozen into the template at creation time** and is
            returned by the API: changing the company preference later does not alter
            templates that already exist. Edit the template to change it.
        send_automatically:
          type: boolean
          default: false
        email_configuration:
          $ref: '#/components/schemas/RecurringEmailConfigRequest'
    CreateRecurringFromInvoiceRequest:
