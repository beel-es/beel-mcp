  /v1/companies/{company_id}/representation:
    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) the operation acts on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompanyRepresentation
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:read
      summary: Get fiscal representation
      description: |
        Returns the state of the AEAT fiscal representation of this company (NIF): whether the
        document has been generated, signed, submitted, accepted or cancelled.

        A company that never started the process is not an error: it answers `200` with the
        `NOT_GENERATED` state, so polling this endpoint is always safe.
      tags:
        - CompanyRepresentation
      responses:
        '200':
          description: Representation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: generateCompanyRepresentation
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      summary: Generate the representation document
      description: |
        Generates the unsigned AEAT representation PDF for this company (NIF), which is the first
        step of the process: download it with
        `GET /v1/companies/{company_id}/representation/document`, sign it digitally and upload it
        back with `POST /v1/companies/{company_id}/representation/submit`.

        The fiscal identity of the company must be complete before the document can be produced;
        an incomplete one is rejected with `400` naming what is missing. A company that already
        holds an active representation is rejected too: cancel it first.

        Send `Idempotency-Key` to make a retry safe: the same key replays the original response
        instead of generating the document twice, whichever of the two routes it arrives through.
      tags:
        - CompanyRepresentation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Representation document generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentationActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold write access
            over it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: cancelCompanyRepresentation
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      summary: Cancel the fiscal representation
      description: |
        Cancels the active AEAT representation of this company (NIF). Until a new document is
        generated and signed, the company can no longer issue invoices against the AEAT
        production environment.

        A company with no active representation is rejected with `400`: cancelling is a state
        transition, not a delete-if-present.
      tags:
        - CompanyRepresentation
      responses:
        '200':
          description: Representation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentationActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold write access
            over it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
