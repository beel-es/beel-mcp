          description: ZIP file with invoice PDFs
          headers:
            X-Bulk-Total:
              description: Total number of requested invoices
              schema:
                type: integer
            X-Bulk-Successful:
              description: Number of PDFs included in ZIP
              schema:
                type: integer
            X-Bulk-Failed:
              description: Number of PDFs that could not be included
              schema:
                type: integer
            X-Bulk-Failures:
              description: JSON array with failure details (base64 encoded if present)
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
