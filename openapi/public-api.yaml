openapi: 3.0.3
info:
  title: BeeL. Public API
  description: |
    Public invoicing API for self-employed professionals in Spain with VeriFactu regulatory compliance.

    Authenticate using API Keys (`Authorization: Bearer <key>`). Keys are scoped and environment-aware:
    `beel_sk_live_*` targets production, `beel_sk_test_*` targets sandbox (no quota consumed, VeriFactu test mode).

    POST endpoints accept an `Idempotency-Key` header (any unique client-generated string) to safely retry requests without creating duplicates.

    Query parameters are strict, across every endpoint. A name an operation does not declare is currently
    **ignored**: the request still returns `200`, but the filter, ordering or flag you sent was never applied —
    the most common case being `per_page`, which is spelled `limit`. From **2026-09-03** an unrecognised query
    parameter is rejected with `400` naming it, instead of being ignored. Until then, any response that dropped
    a parameter carries a `BeeL-Warning` header naming it, so you can find affected requests before the change.

    A value outside a parameter's vocabulary — an unknown enum value, a malformed UUID — is likewise rejected
    with `400`. The fault is in the request target, not in the request content, which is what `422` is defined
    over; `422` is reserved for a request body that is syntactically valid but semantically wrong.

    <!-- generated:rate-limits — cloudflare/bin/render-rate-limit-prose.js -->
    **Rate limiting.** Limits are enforced at the network edge, on a fixed 60-second window, counted
    per API key. Three tiers apply and a single request may count against more than one:

    | Tier | Limit | Applies to |
    | --- | --- | --- |
    | Global | 2000 req / 60 s | Every request to the API |
    | Standard | 300 req / 60 s | `/v1/companies/{company_id}/customers`, `/v1/companies/{company_id}/invoices`, `/v1/customers`, `/v1/invoices`, `/v1/me`, `POST /v1/nif/validate` — each including its sub-paths |
    | Strict | 5 req / 60 s | `/v1/companies/{company_id}/logo`, `POST /v1/accounts/{account_id}/companies/{company_id}/representation/generate`, `POST /v1/accounts/{account_id}/companies/{company_id}/representation/submit`, `POST /v1/accounts/{account_id}/invitations`, `POST /v1/companies/{company_id}/invoices/{invoice_id}/send`, `POST /v1/companies/{company_id}/representation`, `POST /v1/invoices/bulk/send` — each including its sub-paths |

    Exceeding a limit returns `429` with the error code `RATE_LIMIT_EXCEEDED` and the `Retry-After`,
    `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` headers. Successful responses carry
    no `RateLimit-*` header, so a client cannot track its remaining budget ahead of time: retry on
    `429`, honouring `Retry-After`.
    <!-- /generated:rate-limits -->
  version: 1.7.1
  contact:
    name: BeeL. Technical Team
    email: it@beel.es
    url: https://beel.es
  license:
    name: Proprietary
    url: https://beel.es/license
servers:
  - url: https://app.beel.es/api
    description: Production server
security:
  - ApiKeyAuth: []
  - OAuth2: []
tags:
  - name: Invoices
    description: Invoice CRUD operations
  - name: InvoiceLifecycle
    description: Invoice state transitions and scheduling
  - name: InvoiceDelivery
    description: Invoice delivery, bulk operations and exports
  - name: Proforma
    description: |
      A proforma is a non-fiscal commercial document, a formal quote you send a customer
      before invoicing. It lives on the same `/invoices` resource as any other document, so
      you work with it through the invoice endpoints using `type=PROFORMA`. There is no
      separate proforma resource.

      A proforma never enters VeriFactu, so it carries no QR and is never submitted to the
      AEAT, and it consumes no invoice quota. It is numbered from a dedicated non-fiscal
      series, so its number always looks like `PRO-2026-0001`.

      A proforma has a single working state, `ACTIVE`. It does not go through the fiscal
      draft and issue cycle:

      * **Create** it with `type=PROFORMA` and it is born `ACTIVE`, already numbered. It is
        editable and deletable, and there is no separate issue step (`issue_directly` is
        ignored).
      * **Convert** it once the customer accepts. It becomes `CONVERTED` and a new `STANDARD`
        invoice is created in `DRAFT`, linked back through `source_proforma_id`.
      * **Void** it if the offer is rejected or withdrawn (`POST /v1/invoices/{invoice_id}/void`).
        It becomes `VOIDED` with no corrective invoice and nothing sent to the AEAT, and it
        stays on record.
      * **`EXPIRED`** is a derived state for an `ACTIVE` proforma whose `valid_until` has
        passed. It is never stored, so the proforma stays `ACTIVE` underneath and remains
        convertible.

      Proformas appear in the normal invoice list. Use `type=PROFORMA` to see only proformas,
      or `fiscal_only=true` to list just your fiscal invoices.
  - name: Customers
    description: Customer management
  - name: Customer Import
    description: Bulk creation, CSV import, and Holded import operations
  - name: CompanyCustomers
    description: 'The customers of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/customers`. The NIF in the path is the only source of context: the account that owns it is derived from it. It is the canonical form of the operations that `Customers` and `Customer Import` still expose under the flat `/v1/customers`.'
  - name: CompanyCustomerImports
    description: Importing customers into a NIF (company), addressed by `/v1/companies/{company_id}/customers/imports`. The origin of the file travels in the body as `source`, so adding an origin never adds a route, and previewing is a separate operation with no effects instead of a boolean flag.
  - name: Customer Templates
    description: Templates and sample files for customer imports
  - name: Templates
    description: Downloadable file templates. They are fixed files, the same for every credential, and belong to no account and no NIF.
  - name: Products
    description: Product and service catalog management
  - name: CompanyProducts
    description: 'The product/service catalog of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/products`. The NIF in the path is the only source of context: the account that owns it is derived from it. It is the canonical form of the operations that `Products` still exposes under `/v1/products`, and searching is `?q=` on the collection instead of a path of its own.'
  - name: Members
    description: 'Account member management (multi-NIF). Members and their company grants are **shared between Test and Live**: a collaborator is the same person, with the same role and the same grants, in both environments — switching environment changes which data you see, not who may reach it. Reading them works with either API key; changing them requires a live API key or the dashboard (`403 LIVE_CREDENTIAL_REQUIRED` otherwise), because the change lands on the real account.'
  - name: Invitations
    description: 'Member invitations — invite people to the account and revoke pending invites (multi-NIF). Like members, invitations are **shared between Test and Live**: accepting one grants real access, so creating and revoking them requires a live API key or the dashboard (`403 LIVE_CREDENTIAL_REQUIRED` otherwise). Listing and retrieving work with either key.'
  - name: Accounts
    description: 'Account provisioning for partners managing multiple accounts and NIFs. The whole onboarding flow — provisioning, claim tokens and usage — works with either API key: the account is born inert (no NIF switched on, no keys, no owner), which is exactly what you are meant to rehearse in Test. Changing a managed account''s access level and ending its management require a live API key or the dashboard (`403 LIVE_CREDENTIAL_REQUIRED` otherwise): both act on an account that may already be invoicing, and ending management cannot be undone.'
  - name: Provisioning
    description: 'Lifecycle view for accounts you provisioned: track their activation state and manage the access level you hold over them.'
  - name: ConfigurationTax
    description: Tax configuration and tax type catalogs
  - name: TaxTypes
    description: The tax regimes, percentages, withholdings and exemption reasons Spanish law allows. The same for every credential, and readable before the first NIF exists.
  - name: InvoiceSeries
    description: Invoice series management
  - name: ConfigurationVeriFactu
    description: VeriFactu compliance configuration
  - name: ConfigurationPreferences
    description: User language preferences
  - name: InvoiceCustomization
    description: The PDF templates a NIF can be rendered with, each one with a readable, translated name. The same for every account.
  - name: NIF
    description: Tax ID validation against AEAT tax registry
  - name: Company
    description: 'The NIF (company) as a resource of its own, addressed by `/v1/companies/{company_id}`. The NIF in the path is the only source of context: the account that owns it is derived from it.'
  - name: CompanyBranding
    description: 'The invoice branding of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/logo` and `/v1/companies/{company_id}/invoice-customization`. The NIF in the path is the only source of context: the account that owns it is derived from it.'
  - name: CompanyVeriFactuConfiguration
    description: The VeriFactu configuration of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/verifactu-configuration`. The NIF in the path is the only source of context. It is the canonical form of what `ConfigurationVeriFactu` still exposes under `/v1/configuration/verifactu`.
  - name: CompanyTaxConfiguration
    description: The tax configuration of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/tax-configuration`. The NIF in the path is the only source of context. It is the canonical form of what `ConfigurationTax` still exposes under `/v1/configuration/taxes`.
  - name: CompanySeries
    description: The invoice series of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/series`. The NIF in the path is the only source of context. It is the canonical form of what `InvoiceSeries` still exposes under `/v1/configuration/series`.
  - name: CompanyRepresentation
    description: 'The AEAT fiscal representation of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/representation`. The NIF in the path is the only source of context: the account that owns it is derived from it. It is the canonical form of the operations that `PublicCompanyRepresentations` still exposes under `/v1/accounts/{account_id}/companies/{company_id}/representation/…`, reshaped as one REST resource — `GET` reads the state, `POST` creates the document, `DELETE` cancels it — instead of five verbs in the URL.'
  - name: CompanyActivations
    description: 'Switching a NIF (company) on or off in Test or Live, as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/activations`. The NIF in the path is the only source of context: the account that owns it is derived from it.'
  - name: CompanyPaymentConnections
    description: 'The payment provider connections of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/payment-connections`. The NIF in the path is the only source of context: the account that owns it is derived from it. Opening a connection is the sibling sub-resource `…/payment-connections/authorizations`, because it returns an authorization URL and not the connection the collection lists.'
  - name: CompanyPaymentEvents
    description: 'The payment events of a NIF (company) connection, addressed by `/v1/companies/{company_id}/payment-connections/{provider}/events`. The NIF in the path is the only source of context: the account that owns it is derived from it. Events hang from the connection the `{provider}` segment picks, so only the events of that NIF''s connection are reachable.'
  - name: PublicCompanies
    description: Listing and creating the NIFs of an account, under `/v1/accounts/{account_id}/companies`. Operating on one NIF is the `Company` resource.
  - name: PublicCompanyRepresentations
    description: |
      **Deprecated.** VeriFactu representation flow for digital signature and AEAT registration,
      in its account-nested form. Use `CompanyRepresentation`
      (`/v1/companies/{company_id}/representation`), which behaves identically; these routes keep
      working until the date announced in their `Sunset` response header.

      **Complete SaaS integration flow:**
      1. `POST /v1/accounts/{account_id}/companies` — Create company/NIF
      2. `POST /v1/companies/{company_id}/representation` — Generate unsigned PDF
      3. `GET /v1/companies/{company_id}/representation/document` — Download PDF for signing
      4. `POST /v1/companies/{company_id}/representation/submit` — Upload signed PDF
      5. `GET /v1/companies/{company_id}/representation` — Check VeriFactu status
  - name: RecurringInvoices
    description: |
      Recurring invoice template management and automated invoice generation.

      Create templates that automatically generate invoices on a schedule.
      Supports monthly recurrence, pause/resume, skip, manual generation,
      and invoice preview.
  - name: CompanyRecurringInvoices
    description: 'The recurring invoice templates of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/recurring-invoices`. The NIF in the path is the only source of context: the account that owns it is derived from it. It is the canonical form of the operations that `RecurringInvoices` still exposes under `/v1/recurring-invoices`.'
  - name: AccountWebhooks
    description: Outbound webhook subscriptions as a sub-resource of the account itself, addressed by `/v1/accounts/{account_id}/webhooks`. The account in the path is the only source of context — the credential does not decide it, and the `BeeL-Active-Company` header plays no part. It is the canonical form of the operations that `Webhooks` still exposes under `/v1/webhooks`.
  - name: Webhooks
    description: |
      Outbound webhook subscriptions for real-time event notifications.

      Register HTTPS endpoints to receive event payloads when key actions occur
      (e.g. VeriFactu submission accepted/rejected by AEAT).

      All deliveries are signed with HMAC-SHA256 (`BeeL-Signature` header).
      Failed deliveries are retried up to 5 times with exponential backoff.
  - name: AccountRequestLogs
    description: Canonical form of the request logs, addressed by `/v1/accounts/{account_id}/request-logs`. The account in the path authorizes the call; the logs returned are always those of the credential you authenticate with, in its environment, never the whole account's traffic. It replaces the operations that `RequestLogs` still exposes under `/v1/developers/request-logs`.
  - name: RequestLogs
    description: |
      Read-only access to the API request logs generated by your own API keys
      (live + test). Inspect method, path, status, timing, and full request/response
      detail of past calls. Cursor-paginated; sourced from observability storage.
  - name: Emails
    description: |
      History of emails the system has sent on your behalf (invoices,
      verification, onboarding, etc.). Read-only.
  - name: AccountEmails
    description: The sent-email history of an account, addressed by `/v1/accounts/{account_id}/emails` and `/v1/accounts/{account_id}/email-indicators`. The account in the path is the only source of context, instead of being derived from the credential. It is the canonical form of the operations that `Emails` still exposes under `/v1/emails`.
  - name: CompanyFiscalSummary
    description: 'The fiscal summary of a NIF (company) as a sub-resource of the company itself, addressed by `/v1/companies/{company_id}/fiscal-summary`. The NIF in the path is the only source of context: the account that owns it is derived from it.'
paths:
  /v1/me/identity:
    get:
      tags:
        - Identity
      summary: Get my identity (whoami)
      description: |
        Lightweight identity of the authenticated principal. Requires **no scope**:
        any valid API key, OAuth2 token or browser session resolves.

        Two intended uses:
        * **Integrators**: whoami / auth health-check. A `200` confirms the credential
          is valid and tells you which account it belongs to; a `401` means it is not.
        * **Web session**: cheap avatar/name lookup without fetching the full profile.

        `name` resolves as `trade_name ?? legal_name` of the active fiscal profile and
        is `null` until onboarding creates one. Responses are never cached
        (`Cache-Control: no-store`).

        `credential` describes the credential the call was authenticated with — its
        type, the environment it operates on and the permissions it holds — so a client
        can adapt what it offers instead of discovering the limits through a `403`.
      operationId: getMyIdentity
      security:
        - ApiKeyAuth: []
        - OAuth2: []
        - SessionCookie: []
      responses:
        '200':
          description: Identity of the authenticated principal
          headers:
            Cache-Control:
              description: Always `no-store` (personal data, cross-origin consumers)
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MyIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'The credential is genuine, but the account''s plan does not include API access (`error.code` = `FEATURE_NOT_AVAILABLE`, `error.details.feature_code` = `api_access`). Whoami requires no scope, so for an API key or OAuth2 token this is the only refusal besides `401`: without `api_access` the key reaches no public endpoint at all, and saying so here — rather than a `401` that reads as "wrong key" — tells a health-check the credential is fine and the plan is not. Browser sessions never get this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FEATURE_NOT_AVAILABLE
                  message: Your plan does not include api_access
                  details:
                    feature_code: api_access
                    current_plan: FREE
                meta:
                  timestamp: '2025-01-15T10:30:00Z'
                  request_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/me:
    patch:
      tags:
        - Me
      summary: Update my preferences
      description: |
        Updates the preferences of the authenticated person. Today the only
        mutable preference is the interface language.

        The language applies to the interface, to template names and colours in
        invoice customisation, and to the emails the person receives. It belongs
        to the person, not to a fiscal profile: invoice and email languages are
        separate settings of each company.

        **Supported languages:**
        - `es` - Spanish (default)
        - `en` - English
        - `ca` - Catalan

        Replaces `PUT /v1/configuration/language`, which stays available until
        its sunset date and behaves identically.
      operationId: updateMe
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - configuration:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              language: ca
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MyPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/invoices:
    get:
      tags:
        - Invoices
      summary: List invoices
      description: |
        **Deprecated.** Use `GET /v1/companies/{company_id}/invoices`, which returns the same list with the
        same filters. The only difference is the legacy alias `external_reference`, which is not
        carried over: use `external_ref`.
        This route keeps working until the date announced in its `Sunset` response header.

        Returns a paginated list of invoices with optional filters
      operationId: listInvoices
      x-successor:
        method: GET
        path: /v1/companies/{company_id}/invoices
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:read
      parameters:
        - $ref: '#/components/parameters/ActiveCompanyHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Global search across invoice number, recipient name, recipient NIF, and series code (partial, case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          description: |
            Filter by invoice status. Accepts a comma-separated list to match any of several
            statuses, for example `status=DRAFT,ISSUED`. A single value is also valid.
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/InvoiceStatus'
          style: form
          explode: false
        - name: type
          in: query
          description: Filter by invoice type
          schema:
            $ref: '#/components/schemas/InvoiceType'
        - name: fiscal_only
          in: query
          description: |
            When `true`, returns only fiscal documents (STANDARD, CORRECTIVE, SIMPLIFIED),
            excluding proformas and any other non-fiscal document. Defaults to `false`
            (the list returns every document type). Ignored when an explicit `type` is given.
          schema:
            type: boolean
            default: false
        - name: customer_id
          in: query
          description: Filter by customer UUID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: date_from
          in: query
          description: Issue date from (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Issue date to (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: invoice_number
          in: query
          description: Search by invoice number (e.g., 2025/0001)
          schema:
            type: string
        - name: recipient_name
          in: query
          description: Filter by recipient's fiscal name (partial, case-insensitive search)
          schema:
            type: string
        - name: recipient_nif
          in: query
          description: Filter by recipient's NIF (partial search)
          schema:
            type: string
        - name: series_code
          in: query
          description: Filter by series code
          schema:
            type: string
        - name: external_ref
          in: query
          description: |
            Filter by exact external reference (client-supplied order/cart/contract id).

            This parameter was previously named `external_reference`. The old name is still accepted
            for backwards compatibility (see `external_reference` below) and will be withdrawn in a
            future major version — send `external_ref`.
          schema:
            type: string
        - name: external_reference
          in: query
          deprecated: true
          description: |
            **Deprecated** — former name of `external_ref`, still honoured so existing integrations
            keep working. Ignored when `external_ref` is also present. Use `external_ref`.
          schema:
            type: string
        - name: taxable_base_min
          in: query
          description: Minimum taxable base
          schema:
            type: number
            format: double
        - name: taxable_base_max
          in: query
          description: Maximum taxable base
          schema:
            type: number
            format: double
        - name: total_min
          in: query
          description: Minimum invoice total
          schema:
            type: number
            format: double
        - name: total_max
          in: query
          description: Maximum invoice total
          schema:
            type: number
            format: double
        - name: verifactu_status
          in: query
          description: |
            Filter by the VeriFactu submission status of the invoice, using the very same
            vocabulary that `verifactu.submission_status` publishes on each invoice.

            Only invoices with VeriFactu enabled can match. To select the ones outside the
            axis (no VeriFactu record at all), use `verifactu_enabled=false` instead.
          schema:
            $ref: '#/components/schemas/VeriFactuSubmissionStatus'
        - name: verifactu_enabled
          in: query
          description: |
            Filter by whether VeriFactu is enabled for the invoice — the same flag published as
            `verifactu.enabled`. `false` returns the invoices that never reach AEAT.
          schema:
            type: boolean
        - name: metadata
          in: query
          description: |
            Filter by metadata key/value pairs (exact match, AND between keys).
            Repeat the bracket-style param to filter on multiple keys.
            Max 50 pairs per request. Keys must match `^[A-Za-z0-9_\-.]{1,64}$`.
            Example: `?metadata[external_order_id]=ORD-42&metadata[tenant]=acme`
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
            maxProperties: 50
        - name: sort_by
          in: query
          description: Field to sort by (e.g., issue_date, invoice_number, invoice_total)
          schema:
            type: string
        - name: sort_order
          in: query
          description: Sort direction
          schema:
            allOf:
              - $ref: '#/components/schemas/SortOrder'
            default: desc
      responses:
        '200':
          description: Invoice list retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - invoices
                          - pagination
                        properties:
                          invoices:
                            type: array
                            items:
                              $ref: '#/components/schemas/Invoice'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
              examples:
                list_success:
                  $ref: '#/components/examples/list-invoices-success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Invoices
      summary: Create invoice
      description: |
        **Deprecated.** Use `POST /v1/companies/{company_id}/invoices`, which behaves identically.
        This route keeps working until the date announced in its `Sunset` response header.

        Creates a new invoice.

        **Proformas (`type: PROFORMA`):** a proforma is a non-fiscal document. It is created
        directly in the single working state `ACTIVE`, numbered `PRO-...` from the non-fiscal
        series, with no issuance step. `issue_directly` is ignored for proformas, since they
        never reach the fiscal `ISSUED` state. To turn a proforma into a real invoice, use the
        dedicated `convert-to-invoice` endpoint.

        **VeriFactu in the response:** the `verifactu` block states what was applied, so you never
        have to infer it. `verifactu.enabled` says whether this invoice goes to AEAT at all. When
        the invoice is issued in the same call (`issue_directly: true`), `verifactu.submission_status`
        is `PENDING`: submission is asynchronous, so a 2xx means *accepted for submission*, never
        *registered with AEAT* — poll the invoice to see it reach `ACCEPTED` or `REJECTED`. A draft
        has no submission yet, so it reports `enabled` with no `submission_status`, and a proforma
        carries no `verifactu` block at all.

        **Idempotency:** Supports `Idempotency-Key` header to prevent duplicates.
      operationId: createInvoice
      x-successor:
        method: POST
        path: /v1/companies/{company_id}/invoices
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
      parameters:
        - $ref: '#/components/parameters/ActiveCompanyHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: wait_for_pdf
          in: query
          required: false
          description: |
            Same flag as `options.wait_for_pdf`, accepted here too so both routes to a PDF take it
            in the same place — `POST /v1/invoices/{invoice_id}/issue` declares it as a query param
            and this one used to accept it only inside the body.

            Only applies when the invoice is issued in this call (`options.issue_directly: true`).
            If `true`, waits for PDF generation and returns the URL in the response (~1-3s). It is
            enough to ask for it in one of the two places.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
            examples:
              basic_invoice:
                $ref: '#/components/examples/create-basic'
              adhoc_invoice:
                $ref: '#/components/examples/create-with-adhoc-customer'
              issue_directly:
                $ref: '#/components/examples/create-issue-directly'
              custom_email:
                $ref: '#/components/examples/create-with-custom-email'
              simplified_with_nif:
                $ref: '#/components/examples/simplified-with-nif'
              simplified_under_3000:
                $ref: '#/components/examples/under-3000'
              standard_spanish_b2b:
                $ref: '#/components/examples/spanish-b2b'
              standard_multiple_vat:
                $ref: '#/components/examples/multiple-vat-rates'
              standard_irpf:
                $ref: '#/components/examples/irpf-withholding'
              standard_recargo:
                $ref: '#/components/examples/recargo-equivalencia'
              standard_eu_goods_e5:
                $ref: '#/components/examples/b2b-intra-eu-goods-e5'
              standard_eu_services_n2:
                $ref: '#/components/examples/b2b-intra-eu-services-n2'
              standard_b2c_oss_over:
                $ref: '#/components/examples/b2c-oss-over-threshold'
              standard_b2c_oss_under:
                $ref: '#/components/examples/b2c-under-oss-threshold'
              standard_export_e2:
                $ref: '#/components/examples/export-non-eu-goods-e2'
              standard_services_noeu:
                $ref: '#/components/examples/services-non-eu-n2'
              standard_exempt_art20:
                $ref: '#/components/examples/exempt-art-20-medical'
              standard_igic:
                $ref: '#/components/examples/igic-canary-islands'
              standard_not_subject:
                $ref: '#/components/examples/not-subject-art-7-9'
              standard_isp_reverse:
                $ref: '#/components/examples/isp-reverse-charge-s2'
              standard_rebu:
                $ref: '#/components/examples/rebu-used-goods'
      responses:
        '201':
          description: Invoice created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
              examples:
                created_success:
                  $ref: '#/components/examples/created-success'
        '400':
          $ref: '#/components/responses/InvalidJsonFormat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Conflict. One of:
            - Idempotency key already processed, or duplicate invoice number.
            - `INVOICE_DUPLICATE_EXTERNAL_REFERENCE`: a live invoice with the same
              `external_ref` already exists. Fetch it via
              `GET /v1/invoices?external_ref=...`. Deleting it lets you recreate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  $ref: '#/components/examples/conflict-409'
        '422':
          description: 'Validation error, or (when creating and issuing directly) the company/NIF is not ready to issue in this environment. In the latter case `error.code` is `EMISSION_NOT_READY` and `error.details.blockers[]` lists the reasons (`COMPANY_NOT_ACTIVATED`, `ENV_MISMATCH`, `NIF_NOT_REGISTERED`, `NIF_REPRESENTATION_REQUIRED`). Sandbox applies the same gate as production, except `NIF_REPRESENTATION_REQUIRED`: the signed representation is only required when the operation reaches the real tax authority.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  $ref: '#/components/examples/validation-422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
