        description: 'NIF (company) the operation acts on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
      - name: invoice_id
        in: path
        required: true
        description: Invoice ID
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      operationId: issueCompanyInvoice
      tags:
        - CompanyInvoiceLifecycle
      summary: Issue an invoice (DRAFT → ISSUED)
      description: |
        Finalizes a draft invoice of this company: assigns its definitive number from the
        configured series and makes it immutable. Irreversible — an issued invoice is corrected
        with a corrective invoice or voided, never edited.

        PDF and VeriFactu submission are asynchronous: a `200` means *accepted for submission*,
        never *registered with AEAT*.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: wait_for_pdf
          in: query
          required: false
          description: |
            If `true`, waits for PDF generation and returns the URL in the response. Adds ~1-2s of
            latency but guarantees the PDF is immediately available.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Invoice issued successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Cannot issue invoice (invalid status or incomplete data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold the required
            access over it. A NIF that does not exist answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another request is issuing this same invoice. `error.code` is
            `CONCURRENT_MODIFICATION`; nothing was issued twice and no number was consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invoice cannot be issued (validation failed), or the company/NIF is not ready to issue in this environment. In the latter case `error.code` is `EMISSION_NOT_READY` and `error.details.blockers[]` lists the reasons (`COMPANY_NOT_ACTIVATED`, `ENV_MISMATCH`, `NIF_NOT_REGISTERED`, `NIF_REPRESENTATION_REQUIRED`).
