  /v1/companies/{company_id}/payment-connections/{provider}/events/{event_id}/retry:
    parameters:
      - $ref: '#/components/parameters/CompanyIdParam'
      - $ref: '#/components/parameters/ProviderParam'
      - $ref: '#/components/parameters/EventIdParam'
    post:
      operationId: retryCompanyPaymentEvent
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - payment-connections:write
      summary: Retry a payment event of a NIF's connection
      description: |
        Reprocesses a payment event whose automatic invoicing did not complete, applying the
        current configuration of the NIF. Use it after fixing what caused the failure, for
        example a missing invoice series.

        Only events in a retryable state can be retried, and each event admits a limited number
        of retries; otherwise the request returns `400`.
      tags:
        - CompanyPaymentEvents
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Event reprocessed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryManagedPaymentEventResponse'
        '400':
          description: |
            The event cannot be retried: its state does not admit a retry
            (`EVENT_INVALID_STATUS_FOR_RETRY`), it exhausted its retries
            (`EVENT_MAX_RETRIES_EXCEEDED`), or it no longer holds the original provider payload
            (`EVENT_SOURCE_PAYLOAD_UNAVAILABLE`), in which case retrying will never succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CompanyNotAccessible'
        '404':
          $ref: '#/components/responses/EventNotOfThisConnection'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/companies/{company_id}/payment-connections/{provider}/events/{event_id}/draft:
    parameters:
      - $ref: '#/components/parameters/CompanyIdParam'
      - $ref: '#/components/parameters/ProviderParam'
      - $ref: '#/components/parameters/EventIdParam'
    post:
      operationId: generateCompanyPaymentEventDraft
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - payment-connections:write
      summary: Create a draft invoice from a payment event of a NIF's connection
      description: |
        Builds a draft invoice from a payment event that could not be invoiced automatically,
        applying the same recipient resolution and tax treatment the automatic flow would have
        applied. The invoice is left as a draft so it can be reviewed and issued afterwards, and
        it is created in the NIF of the path.

        Only events that were not invoiced can produce a draft; otherwise the request returns
        `400`. If invoicing rules reject the resulting document, the request returns `422`.
      tags:
        - CompanyPaymentEvents
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: Draft invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedPaymentEventDraftResponse'
        '400':
          description: |
            The event state does not allow generating a draft
            (`EVENT_INVALID_STATUS_FOR_DRAFT`), or the event no longer holds the original provider
            payload the draft would be built from (`EVENT_SOURCE_PAYLOAD_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CompanyNotAccessible'
        '404':
          $ref: '#/components/responses/EventNotOfThisConnection'
        '422':
          description: |
            Invoicing rules rejected the draft, for example an amount above the legal limit for
            a simplified invoice when the payment carries no tax id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
