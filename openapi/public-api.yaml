        Retrieves one member invitation of the account. Requires OWNER/ADMIN. The acceptance token is never exposed (it is shown only once, at creation).

        An invitation stays readable for its whole life: `ACCEPTED`, `REVOKED` and `EXPIRED` invitations are returned with their status, exactly as they appear in the list — the record is the audit trail of who was granted access to the account's fiscal data, and revoking it does not erase it. `404` therefore means only one thing: no member invitation with that id exists in this account.
      operationId: getAccountInvitation
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - members:read
      responses:
        '200':
          description: Invitation retrieved successfully
          content:
            application/json:
              schema:
                allOf:
