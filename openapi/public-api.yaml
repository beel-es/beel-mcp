      summary: Get a payment event of a NIF's connection
      description: |
        Retrieves a single payment event of the NIF's connection, including the outcome of its
        automatic invoicing and, when it failed, the stable failure code you can act on.

        An event that does not belong to this NIF's connection returns `404`, the same answer an
        event that does not exist gets, so an event of another NIF is never disclosed.
      tags:
