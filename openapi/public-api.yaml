    delete:
      operationId: deleteCompanyCustomer
      tags:
        - CompanyCustomers
      summary: Delete a customer of a company
      description: |
        Deletes a customer of this company (NIF) that has no invoices. The customer is retained
        internally for tax record-keeping purposes, but is no longer exposed by the API: subsequent
        requests to it return `404`, and it is never included in the customer list, under any value
        of the `active` filter.

        **Identifier reuse:** the NIF or alternative identifier is released, so a new customer may
        be created with the same identifier.

        **Customers with invoices cannot be deleted (`409`).** To stop using a customer, update it
        with `active` set to `false` instead of deleting it.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - customers:write
      responses:
        '200':
          description: Customer deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - message
                        properties:
                          message:
                            type: string
                            example: Customer deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold the required
            access over it. A NIF that does not exist answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            There is no such customer in this company (NIF). It never refers to the NIF in the path:
            a NIF you cannot reach answers `403`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The customer has invoices (`CLIENT_HAS_INVOICES`). The customer is left untouched — it
            is neither deleted nor deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
