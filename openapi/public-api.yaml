    CreateCompanyRequest:
      type: object
      required:
        - nif
        - legal_name
        - entity_type
        - address
      properties:
        nif:
          type: string
          description: NIF/CIF of the business
          example: B12345674
        legal_name:
          type: string
          description: Legal/fiscal name
          example: Mi Empresa SL
        entity_type:
          $ref: '#/components/schemas/EntityType'
        address:
          $ref: '#/components/schemas/Address'
        legal_form:
          type: string
          description: Legal form (SL, SA, ...). Recommended for LEGAL_ENTITY.
          example: SL
        legal_representative:
          $ref: '#/components/schemas/LegalRepresentative'
        trade_name:
          type: string
          description: Commercial/trade name (optional)
          example: Mi Empresa
        default_main_tax:
          $ref: '#/components/schemas/TaxInfo'
        default_irpf_rate:
          type: number
          minimum: 0
          maximum: 100
          description: Default IRPF retention rate for this company's invoices. Omit it and the company is created with no withholding — BeeL never assumes a rate nobody declared.
          example: 15
        numbering:
          $ref: '#/components/schemas/CompanyNumbering'
        aeat_environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          default: TEST
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonAlias("environment")'
          description: |
            AEAT/VeriFactu environment to register this NIF against.
            * `TEST` — Sandbox NIF, invoices reach VeriFactu test (default).
            * `PROD` — Production NIF; requires the AEAT representation
              model to be signed (POST /v1/accounts/{account_id}/companies/{company_id}/representation/submit)
              before real invoices can be issued.

            This field was previously named `environment`. The old name is still accepted as an
            alias for backwards compatibility and will be withdrawn in a future major version —
            send `aeat_environment`.
        activate:
          type: boolean
          default: true
          description: |
            Whether to **switch the company on** in `aeat_environment` as part of this call.

            Creating a company and activating it are two different acts. The NIF profile is free
            and always creatable; the activation is what seeds the invoice series, registers the
            NIF and — in `PROD` — is what gets billed.

            * `true` (default) — unchanged behaviour: the company is created and switched on in
              `aeat_environment`, with its default series seeded there.
            * `false` — only the NIF profile is created. The company is switched on nowhere, has
              no series and cannot issue yet; `aeat_environment` is ignored. Activate it later
              with `POST /v1/companies/{company_id}/activations`, which is also
              the only door that opens a Stripe Checkout when the account has no card on file.

            Series numbering travels with the activation that seeds it: a request with
            `activate: false` and a `numbering` block that asks for anything is rejected with
            `422` `NUMBERING_REQUIRES_ACTIVATION` — the later activation door does not accept
            numbering, so silently accepting it here would discard it forever. Either drop the
            `numbering` block or activate a mode in the same call.
    UpdateCompanyRequest:
      type: object
      description: |
        Editable fields of a company (same set as the profile update).
        `entity_type`, `nif` and `legal_form` are immutable once set;
        `legal_name` can only be corrected together with a successful
        AEAT census re-validation of the NIF. For a company that
        re-validation checks the CIF only — the name is **not verified**,
        so it can never fail because of the name you send.
      properties:
        entity_type:
          allOf:
            - $ref: '#/components/schemas/EntityType'
            - nullable: true
              description: Entity type. IMMUTABLE once set.
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: |
            Legal/fiscal name. Changing it triggers AEAT census re-validation of the NIF.
            For a self-employed individual the census matches NIF and name together, so a
            name it does not recognise is rejected. For a legal entity the name is
            **not verified**: the re-validation only confirms the CIF, and the business
            name held by the census is the only thing to contrast yours against.
        nif:
          allOf:
            - $ref: '#/components/schemas/NIF'
            - nullable: true
              description: NIF/CIF. IMMUTABLE once set.
        legal_form:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
          description: Legal form (SL, SA, ...). IMMUTABLE once set. Only for LEGAL_ENTITY.
        trade_name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: Commercial/trade name for the company
        address:
          $ref: '#/components/schemas/Address'
        legal_representative:
          $ref: '#/components/schemas/LegalRepresentative'
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
            - nullable: true
        email:
          allOf:
            - $ref: '#/components/schemas/Email'
            - nullable: true
        website:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
          description: Website
        logo_url:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
          description: Logo URL
        additional_info:
          type: string
          maxLength: 500
          nullable: true
          description: Additional information displayed on invoices
        default_iban:
          allOf:
            - $ref: '#/components/schemas/IBAN'
            - nullable: true
        default_swift:
          allOf:
            - $ref: '#/components/schemas/SWIFT'
            - nullable: true
        account_holder:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: Bank account holder
        iae:
          type: string
          minLength: 1
          maxLength: 20
          nullable: true
          description: IAE code
        activity_start_date:
          type: string
          format: date
          nullable: true
          description: Activity start date
        default_payment_term:
          type: integer
          minimum: 0
          maximum: 365
          nullable: true
          description: Default payment term in days
        invoice_template_type:
          allOf:
            - $ref: '#/components/schemas/InvoiceTemplateType'
          nullable: true
          description: Invoice PDF template type
        invoice_accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          nullable: true
          description: Invoice PDF accent color (#RRGGBB)
          example: '#fc481d'
        invoice_language:
          allOf:
            - $ref: '#/components/schemas/Language'
            - nullable: true
              description: Language for invoice PDFs
        email_language:
          allOf:
            - $ref: '#/components/schemas/Language'
            - nullable: true
              description: Language for emails
    CompanyData:
      type: object
      description: |
        A company (NIF) owned by the account.

        Its status is described by **two independent axes** — do not conflate them:

        * **Mode activation** (`in_test` / `in_prod`) — which modes this NIF is
          activated in, matching the dashboard's Test/Live switch. A company is a
          single env-agnostic record — there is no Test copy and no Live copy of it;
          what is per-mode is the *activation*, and a NIF can be activated in Test, in
          Live, in both, or in neither. It decides where invoices and quota are
          accounted, NOT whether they reach AEAT.
        * **AEAT emission capability** (`account_state`, `verifactu_status`, and the
          `readiness` block requested with `?include=readiness`) — whether invoices are
          submitted to AEAT with a signed VeriFactu representation.

        A company can bill in the **Live** mode and still have AEAT emission disabled
        (e.g. before the VeriFactu representation is signed). `TEST_ONLY` /
        `in_prod=false` therefore do **not** mean "this account cannot invoice".
      properties:
        id:
          type: string
          format: uuid
          description: Unique company identifier.
        access_level:
          allOf:
            - $ref: '#/components/schemas/AccessLevel'
          description: |-
            How much access the signed-in person has to this company, so a dashboard can label it ("read only") and hide write actions instead of discovering the answer through a `403`. Read-only and derived from who is asking — never sent.

            **Only present when authenticating with a user session.** With an API key the field is absent: what a key may do is set by its own scopes, which are per resource (`invoices:write`, `customers:read`, …) and cannot be reduced to one of three levels. Absent therefore means "does not apply here", never "no access".
        nif:
          type: string
          description: Spanish Tax ID (NIF/CIF). Immutable once set.
        legal_name:
          type: string
          description: |
            Legal/fiscal name of the company. Immutable once set.

            It is the name that was sent when the NIF was registered, not one AEAT
            confirmed: for a legal entity the census identifies the CIF and the name is
            **not verified**. Validate a NIF (`POST /v1/nif/validate`) to read the
            business name the census actually holds.
        trade_name:
          type: string
          description: Commercial/trade name shown in the UI and on invoices. Editable.
        entity_type:
          allOf:
            - $ref: '#/components/schemas/EntityType'
          description: Self-employed individual or legal entity. Immutable once set.
        is_primary:
          type: boolean
          description: True for the account's primary company (the owner's own NIF).
        verifactu_status:
          type: string
          enum:
            - NOT_CONFIGURED
            - PENDING
            - ACTIVE
            - ERROR
          description: |
            AEAT/VeriFactu registration state of this NIF. `NOT_CONFIGURED` means the
            VeriFactu representation is not set up, so invoices are issued without being
            submitted to AEAT. Part of the AEAT-emission axis — independent of `environment`.
        environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          deprecated: true
          description: |
            **Deprecated** — use `in_test` / `in_prod` instead.

            A company (NIF) is a single env-agnostic record; what is per-mode is its
            *activation*, and a company can be activated in Test, in Live, in both, or
            in neither. This single scalar cannot express that: it collapses the pair to
            one value, so it misreports any company activated in both modes. It is kept
            for backwards compatibility and will be removed in a future version.

            This is the data/billing axis, NOT a measure of AEAT capability.
        in_prod:
          type: boolean
          description: |
            Whether this company (NIF) is **activated in Live** (production), regardless
            of whether the AEAT representation is already signed. Derived from the real
            activation fact — NOT from the stamped `environment` scalar — so it stays true
            even for a NIF registered in production but not yet signed. Drives the UI's
            "already in production" state (no spurious "add NIF" prompt when the
            account switches to Live).
        in_test:
          type: boolean
          description: |
            Whether this company (NIF) is **activated in Test** (sandbox). Symmetric to
            `in_prod` and derived from the same activation fact: activation is independent
            per mode, so a company may be activated in Test only, in Live only, in both, or
            in neither. A company that is not activated in the mode you are working in is
            shown *switched off* in the dashboard (visible and labelled, but not selectable)
            rather than hidden.
        aeat_environment:
          allOf:
            - $ref: '#/components/schemas/Environment'
          deprecated: true
          nullable: true
          description: |
            **Deprecated** — use the activation pair `in_test` / `in_prod`, together with
            `verifactu_status`, instead.

            AEAT/VeriFactu environment this NIF is registered against. It is derived, never
            stored: a single scalar cannot express a NIF activated in both modes, nor one
            activated in neither. It is `null` whenever no registration can be asserted —
            no mode activated, or `verifactu_status: NOT_CONFIGURED` — and it is kept for
            backwards compatibility only.
        account_state:
          allOf:
            - $ref: '#/components/schemas/AccountState'
          description: |
            Account-level lifecycle, identical for every company of the account. AEAT emission
            additionally requires the per-NIF representation to be signed.
        address:
          type: object
          nullable: true
          description: |
            Fiscal address of the company, as set via `POST /v1/accounts/{account_id}/companies` and
            `PATCH /v1/accounts/{account_id}/companies/{company_id}`. All fields are optional — a company
            may have a partial address — and the object is `null` when no address
            has been set.
          properties:
            street:
              type: string
              description: Street of the fiscal address.
            number:
              type: string
              description: Street number.
            floor:
              type: string
              description: Floor or level.
            door:
              type: string
              description: Door or apartment.
            postal_code:
              type: string
              description: Postal code.
            city:
              type: string
              description: City or town.
            province:
              type: string
              description: Province.
            country:
              type: string
              description: Country name.
            country_code:
              type: string
              description: ISO 3166-1 alpha-2 country code.
        default_irpf_rate:
          type: number
          nullable: true
          description: |
            Default IRPF withholding rate applied to this company's invoices — the same number
            `POST /v1/accounts/{account_id}/companies` accepts and `GET`/`PUT /v1/configuration/taxes` manages, read back
            where you wrote it.

            **Absent means no rate was ever declared**, which is not the same as `0`. A company
            created without `default_irpf_rate` withholds nothing *because nobody said what to
            withhold*; a company with `0` withholds nothing *because its owner declared so*. Both
            invoice the same, only one is a declaration — so do not fill the absent case in with a
            zero. Exemption is a declaration too and reads as `0`.

            Read-only here. Change it with `PUT /v1/configuration/taxes` with the company in focus;
            this resource does not accept it on `PATCH`.

            Absent from the `201` of `POST /v1/accounts/{account_id}/companies` (that response describes the company just
            created, not its resolved tax configuration) — read it back with `GET`.
        created_at:
          type: string
          format: date-time
          description: When the company was created (ISO 8601).
        readiness:
          allOf:
            - $ref: '#/components/schemas/IssuingReadinessData'
          nullable: true
          description: |
            Issuing-readiness status of this company. Present ONLY when the request
            asks for it via `?include=readiness`; otherwise omitted/null. Same shape as
            `GET /v1/companies/{company_id}/issuing-readiness`.
    CompanyCreatedData:
      allOf:
        - $ref: '#/components/schemas/CompanyData'
        - type: object
          properties:
            series:
              type: array
              items:
                $ref: '#/components/schemas/InvoiceSeries'
              description: |
                Invoice series seeded by the activation this request performed, one per
                document type (ordinary, simplified, corrective) — the same shape as
                `GET /v1/configuration/series`, so no second call is needed to confirm
                which series the company was born with (including any custom `numbering`
                the request carried).

                An empty array when the request did not activate any mode (`activate: false`
                seeds no series). On an env-additive activation (same NIF, other environment)
                it reflects the series of the environment just activated.
    CompanyResponse201:
      type: object
      properties:
        success:
          type: boolean
        data:
