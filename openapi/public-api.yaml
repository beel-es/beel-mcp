  /v1/accounts/{account_id}/request-logs:
    get:
      tags:
        - AccountRequestLogs
      summary: List API request logs
      description: |
        Returns the history of public API requests made with **this credential** in **this
        environment**. It is not the account's traffic: requests made by other users or by other
        users' API keys in the same account are never returned. The `{account_id}` in the path
        authorizes the call; it does not widen what you can see.

        Only `auth_type=API_KEY` traffic is recorded.

        **Environment is not a filter**: results are always scoped to the environment of the
        credential you authenticate with — a `beel_sk_test_*` key sees test traffic only, a
        `beel_sk_live_*` key sees live traffic only. To see the other environment, use a key
        from that environment.

        **Cursor pagination**: navigate with an opaque `cursor`. There is no jump to page N
        because the source (Axiom/APL) does not support efficient offset. Defaults to the
        last 30 days; narrow it with `from`/`to`.
      operationId: listAccountRequestLogs
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - logs:read
      parameters:
        - name: account_id
          in: path
          required: true
          description: Account the call is authorized against. It does not widen the result set.
          schema:
            type: string
            format: uuid
        - name: only_errors
          in: query
          required: false
          description: If true, only requests with status >= 400.
          schema:
            type: boolean
            default: false
        - name: method
          in: query
          required: false
          description: Filter by HTTP method.
          schema:
            type: string
            example: POST
        - name: http_status
          in: query
          required: false
          description: Filter by an exact HTTP status code.
          schema:
            type: integer
            minimum: 100
            maximum: 599
        - name: path_contains
          in: query
          required: false
          description: Filter by path substring (case-insensitive).
          schema:
            type: string
            example: /v1/invoices
        - name: api_key_id
          in: query
          required: false
          description: Filter by a specific API key.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Lower bound of the time range (inclusive). Defaults to 30 days ago.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Upper bound of the time range (inclusive). Defaults to now.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by a previous response (next_cursor / prev_cursor).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Logs retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogListResponse'
        '400':
