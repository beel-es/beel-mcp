                - new_status
              properties:
                invoice_ids:
                  type: array
                  description: List of invoice IDs to update
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/UUID'
                new_status:
                  type: string
                  description: Target status for the invoices
                  enum:
