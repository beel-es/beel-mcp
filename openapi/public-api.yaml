      description: |
        Sets the lifecycle status of a recurring invoice template, which is how generation is
        paused and resumed:

        - `PAUSED` stops automatic generation, keeping the schedule configuration intact.
        - `ACTIVE` resumes generation and recalculates the next generation date from today.

        `COMPLETED` is reached on its own when the schedule runs out and cannot be set through
        this operation. Transitions that the schedule does not allow — resuming a template that is
        already active, or one paused because the company still cannot issue — are rejected.
      security:
