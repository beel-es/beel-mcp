        **Deprecated.** Use `DELETE /v1/companies/{company_id}/customers/{customer_id}`, which behaves identically.
        This route keeps working until the date announced in its `Sunset` response header.

        Deletes a customer that has no invoices. The customer is retained internally for tax
        record-keeping purposes, but is no longer exposed by the API: subsequent requests to this
        customer return `404`, and the customer is never included in the customer list, under any value
        of the `active` filter.

        **Identifier reuse:** The NIF or alternative identifier is released, so a new customer may be
        created with the same identifier.

        **Customers with invoices cannot be deleted (`409`).** Invoices keep their own copy of the
        recipient's details from the moment they were issued, so they would survive intact — what would
        not survive is the customer's identity: releasing the identifier allows a second customer with
        the same NIF, so one real person ends up as two records with their invoices split between them.

        **Stopping use of a customer:** To stop using a customer — whether or not it has invoices —
        update it with `active` set to `false` instead of deleting it. That releases nothing and keeps
        the customer retrievable; inactive customers are returned by `GET /v1/customers?active=false`.
