  /v1/invoices/{invoice_id}/convert-to-invoice:
    post:
      tags:
        - Proforma
      summary: Convert a proforma into an invoice
      description: |
        **Deprecated.** Use `POST /v1/companies/{company_id}/invoices/{invoice_id}/convert-to-invoice`, which behaves identically.
        This route keeps working until the date announced in its `Sunset` response header.

        Converts an accepted proforma into a real invoice.

        Only proformas in status `ACTIVE` can be converted. A proforma shown as `EXPIRED`
        is still `ACTIVE` underneath (expiry is only a signal), so it converts too.

        The proforma is preserved as the record of what the customer accepted. It keeps its
        `PRO-...` number and PDF and moves to the terminal status `CONVERTED`. The call
        creates a new `STANDARD` invoice in `DRAFT`, linked back through `source_proforma_id`,
        which you can edit and then issue as usual.

        Pass `issue: true` to emit that invoice in the same call, assigning a fiscal number
        and running the normal quota, ledger and VeriFactu pipeline. The operation is atomic.
        If emission fails (quota exhausted, unsigned NIF, misconfigured series) nothing is
        created and the proforma stays `ACTIVE`. Otherwise the invoice is left in `DRAFT` for
        you to fine-tune first.

        The call is idempotent. Once a proforma is `CONVERTED`, a second call returns a
        business error instead of creating another invoice.

        Common errors: `CONVERSION_REQUIRES_PROFORMA` when the document is not a proforma,
        `PROFORMA_NOT_CONVERTIBLE` when it is not in `ACTIVE`, and `PROFORMA_ALREADY_CONVERTED`
        when it has already been converted.
      operationId: convertProformaToInvoice
      x-successor:
        method: POST
        path: /v1/companies/{company_id}/invoices/{invoice_id}/convert-to-invoice
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: invoice_id
          in: path
          required: true
          description: Proforma ID to convert
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertProformaToInvoiceRequest'
      responses:
        '201':
          description: Invoice created successfully from the proforma (draft, or emitted when `issue` is true)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The proforma has already been converted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Document is not a proforma, or its status does not allow conversion, or the company/NIF is not ready to issue in this environment. In the latter case `error.code` is `EMISSION_NOT_READY` and `error.details.blockers[]` lists the reasons (`COMPANY_NOT_ACTIVATED`, `ENV_MISMATCH`, `NIF_NOT_REGISTERED`, `NIF_REPRESENTATION_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
