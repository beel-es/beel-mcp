          format: uuid
    post:
      operationId: createCompanyInvoiceBatch
      tags:
        - CompanyInvoiceDelivery
      summary: Apply one operation to a set of invoices
      description: |
        Applies a single operation to up to 50 invoices of this company and reports, invoice by
        invoice, which succeeded and which failed.

        **Not atomic.** Each invoice is processed in its own transaction: issuing is irreversible,
        so the ones already issued stay issued if a later one fails.

        Downloading PDFs, sending email and exporting are not operations of this batch: each one
        returns something different and has its own sibling sub-resource (`pdf-archive`,
        `deliveries`, `exports`).
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
