    UpdateRecurringInvoiceRequest:
      type: object
      description: |
        Request to **replace** a recurring invoice (`PUT`).

        Send the template complete: `end_date`, `payment_method` (with its `payment_iban`,
        `payment_swift` and `payment_term_days`), `notes` and `email_configuration` are
        cleared when you leave them out. To change a few fields and keep the rest
        untouched, use `PATCH /v1/recurring-invoices/{recurring_invoice_id}`.
      properties:
        name:
          type: string
          maxLength: 255
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
        start_date:
          type: string
          format: date
          description: |
            Date the subscription started. A past date is accepted and stored as sent — useful
            when migrating subscriptions from another system — but it never anchors generation
            in the past: `next_generation` moves to the first upcoming `day_of_month`. Invoices
            are never back-dated, so the missed periods are not generated.
        preview_days:
          type: integer
          minimum: 0
          maximum: 30
          description: Days before emission date to create a draft for review. 0 means immediate emission.
        end_date:
          type: string
          format: date
          nullable: true
        series_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Recipient of the generated invoices. Send `null` to leave the template without
            a recipient; omit it to keep the current one.
        lines:
          type: array
          minItems: 1
          nullable: true
          items:
            $ref: '#/components/schemas/RecurringLineRequest'
          description: |
            Template lines, replaced as a whole. Omit them (or send `null`) to keep the
            current ones — a template with no lines invoices nothing, so an empty array is
            rejected.
        payment_method:
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'
          nullable: true
        payment_iban:
          type: string
          nullable: true
        payment_swift:
          type: string
          nullable: true
        payment_term_days:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        verifactu_enabled:
          type: boolean
          description: |
            Whether the invoices this template generates enter VeriFactu.

            Omitting it leaves the current value untouched — it is never read as
            "turn it off". Send `false` explicitly to disable VeriFactu, `true` to enable it.
        send_automatically:
          type: boolean
        email_configuration:
          $ref: '#/components/schemas/RecurringEmailConfigRequest'
    SetRecurringInvoiceStatusRequest:
      type: object
      required:
