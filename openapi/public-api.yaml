  /v1/companies/{company_id}/activations:
    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) being switched on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
    post:
      operationId: activateCompanyById
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      summary: Switch a NIF on in Test or Live
      description: |-
        Switches an existing NIF on in the mode carried in the body. This is how a NIF that already exists reaches Live: `POST /v1/accounts/{account_id}/companies` only creates one already switched on, so a NIF created in Test — which is how every provisioned account starts — has no other way there.
        The mode is explicit in the body and never taken from the key's environment, so a Test key can switch a NIF on in Live.
        `TEST` is immediate and free. `PROD` is immediate when the account already has a card on file or an enterprise contract, and the NIF is added to the existing subscription. With no card on file it returns `402 CHECKOUT_REQUIRED`: capturing a card is a browser flow, so pass `success_url` and `cancel_url` to get a `checkout_url` to hand to the account holder.
        Idempotent: repeating the call neither opens a second checkout nor adds a second subscription item; it returns the existing activation with `already_active: true`. Sending the same `Idempotency-Key` to this route and to the nested one it replaces is the same operation, so it is replayed and never charged twice.
        It also cancels a pending switch-off. While the switch-off is pending the NIF is still on — it just carries an effective date — so switching it on again only removes that date, with nothing charged or credited, and answers `scheduled_deactivation_cancelled: true`.
        Requires the `companies:write` scope and access to the NIF. Switching on in Live also requires being the billing subject of the account (`403 NOT_BILLING_OWNER` otherwise).
      tags:
        - CompanyActivations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateCompanyRequest'
            example:
              environment: PROD
      responses:
        '201':
          description: The NIF is switched on in that mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyActivationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Switching on in Live requires payment. `CHECKOUT_REQUIRED` means there is no card on file yet; `error.details.checkout_url` carries the checkout when `success_url` and `cancel_url` were supplied. `PAYMENT_REQUIRED` means billing exists but is past due, and the outstanding invoice has to be settled first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`ACTIVE_COMPANY_NOT_ACCESSIBLE` — your account does not own or manage this NIF, or does not hold write access over it. A NIF that does not exist answers exactly the same. `NOT_BILLING_OWNER` — switching a NIF on in Live requires being the billing subject of the account. `BILLING_MANAGED_BY_PROVIDER` — the account''s billing is run by its provider, so the switch has to be requested from them; retrying will not help.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`NIF_PROD_ALREADY_ACTIVE_IN_ANOTHER_ACCOUNT` — another account already has this NIF in Live. A NIF can only invoice in Live from one account, so the other one has to switch it off first.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - CompanyActivations
      summary: Switch a NIF off in Test or Live
      operationId: deactivateCompanyById
      description: |-
        Switches the NIF off in that mode only; the other mode is untouched.
        In Live the switch-off is scheduled, not immediate: the cycle is paid up front, so the response carries an `effective_at` and the NIF keeps invoicing until then. Nothing is refunded. `effective_at` is the end of the current billing cycle, unless the NIF was switched on within that same cycle, in which case it is the end of the next one.
        `TEST` and `PROD` under an enterprise contract are immediate and answer with no `effective_at`.
        The activation is sealed rather than deleted, and only once `effective_at` arrives: the history survives, and in Live that sealing is what releases the NIF for another account. After it takes effect the NIF can neither issue nor correct invoices until switched on again.
        Idempotent: switching off a mode whose switch-off is already pending returns the same date with `already_scheduled: true`. Switching off a mode that was never on is a silent no-op.
        Requires the `companies:write` scope and access to the NIF. In Live it also requires being the billing subject of the account. A NIF you do not reach answers `403`, and so does a NIF that does not exist.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      parameters:
        - name: environment
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Environment'
          description: Mode to switch the NIF off in.
      responses:
        '200':
          description: Switch-off registered — scheduled in Live, immediate otherwise.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanyDeactivation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
