        - Each invoice must be in a valid status for the requested transition
        - For PAID: payment_date is required
      operationId: changeInvoicesStatusBulk
      x-successor:
        method: POST
        path: /v1/companies/{company_id}/invoices/batches
      deprecated: true
      security:
