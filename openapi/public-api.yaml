              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts:
    get:
      tags:
        - Provisioning
      summary: List the accounts you provisioned, with lifecycle status
      description: Returns the accounts you provisioned, each with its lifecycle `status` (`PROVISIONED` → `CLAIMED` → `ACTIVE`) and the access you hold. Newest first, cursor-paginated. Filter by `status`, or look one up by `external_ref` (your own id) — an `external_ref` that matches nothing returns an empty list, never an error. Requires the `accounts:read` scope.
      operationId: listAccounts
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:read
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProvisioningStatus'
        - name: external_ref
          in: query
          required: false
          description: Your own id for the account; returns the 0..1 matching accounts.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of accounts to return per page (1–200). Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's `next_cursor`.
          schema:
            type: string
      responses:
        '200':
          description: A page of provisioned accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - accounts
                        properties:
                          accounts:
                            type: array
                            items:
                              $ref: '#/components/schemas/ManagedAccountSummary'
                          next_cursor:
                            type: string
                            nullable: true
                            description: Pass as `cursor` for the next page; `null` when there are no more results.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Accounts
      summary: Provision an account
      description: |-
        Provisions a new account on BeeL. and returns a one-time `claim_token` to deliver to the account holder so they can set their password and take ownership. The holder can be an self-employed individual or a legal entity. Privileged: requires the `accounts:write` scope (only on your provisioner key). Idempotent by `external_ref`. Use `access_level` to choose the management level you keep over the account (default: billing only — you pay their subscription but do not see their data).

        If you previously ended your management of this account (`DELETE /v1/accounts/{account_id}/management`) and its holder has not claimed it yet, provisioning the same email **reactivates** that account instead of creating a new one: the same account, holder, NIFs and invoices come back under your management, with the `external_ref` and `access_level` of this request, and it counts towards your billable usage again. Once the holder has claimed the account it is theirs, and only they can grant you access again.
      operationId: provisionAccount
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionAccountRequest'
      responses:
        '201':
          description: 'Account provisioned successfully. **Business idempotency** by `external_ref`: resending the same `external_ref` returns **201 with the same account id** (not 409); a fresh `claim_token` is re-issued while the account is still unclaimed (and the previous one is invalidated). For **exact response idempotency** (same body, same token on retries) send an `Idempotency-Key` header — the response is cached for 24h.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvisionAccountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            Conflict. Returned when the email is already used by an existing BeeL. account that this request can neither reuse idempotently (same `external_ref`) nor reactivate. Two distinct cases:

            - `PROVISIONING_ACCOUNT_CLAIMED` — you did manage this account and ended it, but its holder has already claimed it. It is theirs now: ask them to grant you access from their account. Provisioning cannot take it back.
            - `PROVISIONING_EMAIL_ALREADY_REGISTERED` — the email belongs to an account you never managed, one someone else manages, or one whose management someone else ended. Use a different email or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}:
    get:
      tags:
        - Provisioning
      summary: Get a provisioned account's authoritative status
      description: Returns the current lifecycle status and access for one account you provisioned. A `403` is returned when the account was not provisioned by you or does not exist (existence is not disclosed). Requires the `accounts:read` scope.
      operationId: getAccount
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:read
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The provisioned account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ManagedAccountSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/access-level:
    patch:
      tags:
        - Accounts
      summary: Change your management access over an account you provisioned
      description: |-
        Updates the access you hold over an account you provisioned: `NONE` (you keep paying for their subscription but cannot see their data), `VIEW` (read their data) or `OPERATE` (issue and edit invoices for them). Issuing on their behalf also requires a signed fiscal representation from the account holder.
        Privileged: requires the `accounts:write` scope. A `403` is returned when the account was not provisioned by you, when it does not exist (existence is not disclosed), and when you try to RAISE the access level after the account holder has taken ownership of the account — once claimed, only the holder can raise it; you may keep it or lower it.
      operationId: changeManagedAccountAccessLevel
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:write
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAccessLevelRequest'
      responses:
        '204':
          description: Access updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenLiveCredentialRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/management:
    delete:
      tags:
        - Accounts
      summary: End your management of an account you provisioned
      description: |-
        Ends the management relationship over an account you provisioned: you lose access to it and its NIFs stop counting towards your billable usage from the next billing cycle. The account holder keeps the account, its NIFs and its invoices, and becomes responsible for their own subscription; nothing is deleted or anonymised.
        Privileged: requires the `accounts:write` scope. A `403` is returned when the account was not provisioned by you, when it does not exist (existence is not disclosed) and when its management has already ended.

        **Reversible only while the account stays unclaimed.** If the holder has not claimed the account, provisioning the same email again reactivates it (see `POST /v1/accounts`). Once they claim it, the account is theirs and provisioning returns `409 PROVISIONING_ACCOUNT_CLAIMED`: getting the management back then requires their consent, not just their email address. Only the manager who ended the relationship can reactivate it.
      operationId: endAccountManagement
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:write
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Management ended. The account remains active under its holder.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenLiveCredentialRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/claim-tokens:
    post:
      tags:
        - Accounts
      summary: Issue a claim token for an account you provisioned
      description: |-
        Issues a single-use `claim_token` for an account you provisioned, so its holder can set a password and take ownership. Privileged: requires the `accounts:write` scope.

        It serves the two moments the alta cannot: **giving a holder to an account provisioned without `email`** (send the holder's address in the body and the person is created here, not at provisioning time), and **re-issuing a token that expired** — they last 30 days, which with a large portfolio starts to bite in the second month.

        **This is not the member invitation of `/v1/accounts/{account_id}/invitations`.** That one invites an extra person into an account that already has a holder; this one hands the account itself over to its holder. It is the counterpart of the private claim flow the holder completes, not a second way of doing it.

        **Tokens are a collection with a single live element**: issuing again invalidates the previous token — the old link stops working the moment you ask for a new one. A `404` is returned when the account was not provisioned by you or does not exist (existence is not disclosed).
      operationId: createAccountClaimToken
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:write
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimTokenRequest'
      responses:
        '201':
          description: Token issued. Any previously issued token for this account is now invalid. Send an `Idempotency-Key` header to get the same token back on a retry instead of a fresh one.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/ClaimTokenResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict. `PROVISIONING_ACCOUNT_CLAIMED` — the holder already took ownership, so there is nothing left to claim. `PROVISIONING_EMAIL_ALREADY_REGISTERED` — the `email` you sent belongs to another BeeL. account. `CLAIM_TOKEN_HOLDER_MISMATCH` — the account already has a holder and the `email` you sent is a different one; omit it to re-issue for the holder it already has.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/usage:
    get:
      tags:
        - Accounts
      summary: Provisioning usage of your own account
      description: |-
        Returns how many accounts you have provisioned and how many NIFs (companies) they hold — the billable figure for your offline B2B invoice. Requires the `accounts:read` scope.

        `account_id` is **your own account**: usage is a property of the provisioner, not of each provisioned account. Any other id — an account you provisioned, one belonging to someone else, or one that does not exist — returns the same `404`, so the endpoint cannot be used to probe which accounts exist.
      operationId: getAccountUsage
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - accounts:read
      parameters:
        - name: account_id
          in: path
          required: true
          description: Your own account id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provisioning usage of the caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProvisioningUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/companies/{company_id}/fiscal-summary:
