        body as `source`, not in the URL, so adding an origin never adds a route.

        | `source` | File | Limits |
        |---|---|---|
        | `csv` | CSV following the import template | 5 MB, 1,000 records |
        | `holded` | Excel (`.xlsx`) exported from Holded contacts | 10 MB, 5,000 records |

        This operation **writes**: the customers it accepts are created. To see what would happen
        without writing anything, use `POST .../customers/imports/preview`, which is a separate
        operation with no effects at all — the import is never governed by a boolean flag.

        **Idempotency:** `Idempotency-Key` is **required**. Re-importing the same file does not
        duplicate customers: a record whose tax identifier already exists in this company is
        reported as a duplicate and is not created again.
