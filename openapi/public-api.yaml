        Changes the status of multiple invoices in a single operation.

        **Supported status changes:**
        - **SENT:** Mark multiple invoices as sent (from ISSUED)
        - **PAID:** Mark multiple invoices as paid (from ISSUED, SENT, or OVERDUE)

