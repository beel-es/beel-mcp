        '404':
          description: |
            The NIF has no connection for this `{provider}`. The `404` speaks of the connection
            named by the path, never of the NIF: a NIF you cannot reach always answers `403`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
