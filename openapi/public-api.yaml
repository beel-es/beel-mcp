    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) the operation acts on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
      - name: invoice_id
        in: path
        required: true
        description: Invoice ID
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      operationId: getCompanyInvoiceSchedule
      tags:
        - CompanyInvoiceLifecycle
      summary: Get the scheduling of an invoice
      description: |
        Returns the date and generation mode currently scheduled for this invoice. An invoice that
        is not scheduled answers `404`: the sub-resource does not exist yet.

        This read is what makes `generation_mode` tolerable as a required field on the `PUT`:
        a client that only wants to move the date can read the current mode and send it back.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:read
      responses:
        '200':
          description: Scheduling retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceScheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold the required
            access over it. A NIF that does not exist answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The invoice does not exist, or it is not scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: setCompanyInvoiceSchedule
      tags:
        - CompanyInvoiceLifecycle
      summary: Schedule or reschedule an invoice
      description: |
        Replaces the scheduling of a draft invoice, whether it had one or not: scheduling for the
        first time and moving an existing schedule are the same act on the same sub-resource.

        `generation_mode` is required. There is no default on purpose: silently falling back to
        `DRAFT` would downgrade an `ISSUE_AND_SEND` and the invoice would never be issued.

        Requires the `scheduled_invoices` feature.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInvoiceScheduleRequest'
      responses:
        '200':
          description: Scheduling applied successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: |
            The invoice is in a status that cannot be scheduled: already issued, voided or
            corrected (`error.code` `INVOICE_STATUS_NOT_SCHEDULABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold the required
            access over it. A NIF that does not exist answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Validation error. A missing `generation_mode` is rejected here: there is no default,
            because silently falling back to `DRAFT` would downgrade an `ISSUE_AND_SEND` and the
            invoice would never be issued. `SCHEDULED_DATE_IN_PAST` when `scheduled_for` is before
            today, with the rejected value in `error.details.scheduled_for`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteCompanyInvoiceSchedule
      tags:
        - CompanyInvoiceLifecycle
      summary: Remove the scheduling of an invoice
      description: |
        Removes the scheduling of an invoice, leaving it as a plain draft. Idempotent: an invoice
        that is not scheduled answers `204` all the same, because the requested end state is
        already the actual one.

        It is **not** gated by the `scheduled_invoices` feature on purpose. Unscheduling after a
        plan downgrade must keep working, or invoices stay scheduled and issue themselves.
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '204':
          description: The invoice is not scheduled
        '400':
          description: |
            The invoice is already issued, so there is no scheduling to remove (`error.code`
            `INVOICE_STATUS_NOT_SCHEDULABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company), or does not hold the required
            access over it. A NIF that does not exist answers the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
