  /v1/invoices/{invoice_id}/corrective:
    post:
      tags:
        - InvoiceLifecycle
      summary: Create corrective invoice
      description: |
        **Deprecated.** Use `POST /v1/companies/{company_id}/invoices/{invoice_id}/corrective`, which behaves identically.
        This route keeps working until the date announced in its `Sunset` response header.

        Creates a corrective invoice to correct or void an issued invoice.

        **Rectification types:**
        - **TOTAL**: Completely voids the original invoice (original status → VOIDED)
        - **PARTIAL**: Partially corrects the original invoice (original status → RECTIFIED)

        **VeriFactu codes:**
        - R1: Legal error and Art. 80 One, Two and Six LIVA
        - R2: Article 80 Three LIVA (Bankruptcy)
        - R3: Article 80 Four LIVA (Bad debts)
        - R4: Other causes
        - R5: Simplified invoices (only for simplified)

        **Validations:**
        - Original invoice must be in status ISSUED, SENT, PAID, OVERDUE or RECTIFIED
        - Cannot rectify a DRAFT invoice (must be issued first)
        - Cannot rectify a VOIDED invoice (final status)
        - For TOTAL rectification: Another total corrective cannot already exist
        - For PARTIAL rectification: Multiple partial correctives are allowed

        **Lines:**
        - TOTAL: Optional (if not provided, original lines are copied with negated amounts)
        - PARTIAL: REQUIRED (adjustment lines with positive or negative amounts)

        **Series:**
        - Omit `series_id` and the corrective invoice is numbered in your company's **default
          series for corrective invoices** — the same series the dashboard preselects. It is
          NOT numbered in the original invoice's series, which is an ordinary or simplified one.
        - Send `series_id` explicitly to pick a specific corrective series.
        - Never created for you: if the company has no default corrective series the request
          fails with `422 SERIES_DEFAULT_NOT_FOUND`. Check
          `GET /v1/configuration/series/defaults-status` to see which default is missing.
      operationId: createCorrectiveInvoice
      x-successor:
        method: POST
        path: /v1/companies/{company_id}/invoices/{invoice_id}/corrective
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - invoices:write
      parameters:
        - name: invoice_id
          in: path
          required: true
          description: Invoice ID to rectify
          schema:
            $ref: '#/components/schemas/UUID'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCorrectiveInvoiceRequest'
            examples:
              corrective_total_r1:
                $ref: '#/components/examples/corrective-total-r1'
              corrective_total_r4:
                $ref: '#/components/examples/corrective-total-r4'
              corrective_partial_r2:
                $ref: '#/components/examples/corrective-partial-r2'
              corrective_partial_r3:
                $ref: '#/components/examples/corrective-partial-r3'
              corrective_r1_partial_discount:
                $ref: '#/components/examples/r1-partial-discount'
              corrective_r5_total_simplified:
                $ref: '#/components/examples/r5-total-simplified'
      responses:
        '201':
          description: Corrective invoice created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid rectification data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Original invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A total corrective invoice already exists for this invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Original invoice cannot be rectified (invalid status); or the company/NIF is not ready to issue in this environment — `error.code` is `EMISSION_NOT_READY` and `error.details.blockers[]` lists the reasons (`COMPANY_NOT_ACTIVATED`, `ENV_MISMATCH`, `NIF_NOT_REGISTERED`, `NIF_REPRESENTATION_REQUIRED` — the last one only in production, where the operation reaches the real tax authority); or the explicit `series_id` is a series of the wrong type — `error.code` is `SERIES_INCOMPATIBLE_DOC_TYPE` and `error.details.expected_document_type` says which type was required; or — when `series_id` is omitted — the company has no default series compatible with corrective invoices (`error.code` is `SERIES_DEFAULT_NOT_FOUND`, with `error.details.expected_document_type` and the endpoint that diagnoses it). That last one is an account configuration problem, not a request problem: create the corrective series, or send an explicit `series_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                incompatible_series:
                  $ref: '#/components/examples/incompatible_series'
                no_default_corrective_series:
                  $ref: '#/components/examples/no_default_corrective_series'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
