  /v1/companies/{company_id}:
    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) the operation acts on. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist, so the existence of a NIF in another account is never disclosed.'
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompanyById
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:read
      summary: Get company details
      description: |
        Returns details of a specific company (NIF), including its VeriFactu status.
        Your credential must own or **manage** the NIF; any other NIF returns `403`.

        The invoice series of the company are not part of this response: read them from
        `GET /v1/configuration/series` with the company in focus.
      tags:
        - Company
      responses:
        '200':
          description: Company details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchCompanyById
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      summary: Update company details
      description: |
        Updates editable fields of a company (same field set as the profile).
        `entity_type`, `nif` and `legal_form` are immutable once set; changing
        `legal_name` requires a successful AEAT census re-validation of the NIF.
        For a company that re-validation checks the CIF only — the name is
        **not verified** — so it cannot fail because of the name you send.
        Your credential must own or **manage** the NIF with write access;
        otherwise it returns `403`.

        Send `Idempotency-Key` to make a retry safe: the same key replays the original
        response instead of applying the change twice, whichever of the two routes it
        arrives through.

        The invoice series of the company are not part of this response: read them from
        `GET /v1/configuration/series` with the company in focus.
      tags:
        - Company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company) with write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteCompanyById
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:write
      summary: Delete a company
      description: |
        Removes the NIF from your account: it stops appearing in the account and stops being
        billed. **Invoices already issued are kept in the database, but the company-scoped
        public API can no longer resolve them once the NIF is removed.** A NIF with a live
        activation in Live cannot be removed (`409 COMPANY_ACTIVE_IN_PRODUCTION`), nor can the
        account's primary NIF (`400 CANNOT_DELETE_PRIMARY`).

        Leaving Live is a *scheduled* deactivation — the current cycle is charged and served in
        full — so deactivate the NIF first and remove it once the deactivation takes effect.
        NIFs that were never activated, or that are only active in Test, are removed right away.

        A company that has **any invoice in Live** — issued, draft or proforma — cannot be
        deleted either (`409`): deleting it would orphan those invoices and free the NIF to be
        registered again numbering from 1. Delete its drafts and proformas first; once it has
        issued, the way out is the scheduled deactivation. Invoices in **Test never block**: a
        test company with a hundred rehearsal invoices is deleted right away.

        Send `Idempotency-Key` to make a retry safe: without it, a retry after a timeout answers
        `403` instead of the original `204`.
      tags:
        - Company
      responses:
        '204':
          description: Company deleted
        '400':
          description: |
            The NIF is the primary company of the account (`CANNOT_DELETE_PRIMARY`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Your account does not own or manage this NIF (company) with write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The company cannot be deleted:

            - `COMPANY_ACTIVE_IN_PRODUCTION` — it is active in Live. Deactivate it in Live and
              delete it from the effective date of that deactivation.
            - `COMPANY_HAS_INVOICES` — it has invoices in Live (issued, draft or proforma).
              Delete its drafts and proformas first; once it has issued, deactivate it instead.
              Invoices in Test never block the deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/companies/{company_id}/issuing-readiness:
    parameters:
      - name: company_id
        in: path
        required: true
        description: 'NIF (company) whose issuing readiness is evaluated. It is the only source of context: the account that owns it is derived from it, and the `BeeL-Active-Company` header plays no part. A NIF you do not reach answers `403`, and so does a NIF that does not exist.'
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompanyIssuingReadiness
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - companies:read
      summary: Get issuing readiness
      description: |
        Returns whether this company (NIF) can issue its STANDARD invoice right now, in
        this environment — and if not, exactly what is missing. Readiness is a per-NIF
        property, evaluated independently for each company under the account (whether it
        has 1 or N NIFs).

        Issuing ANY fiscal document requires the company to be activated in the
        environment of that document, whether or not it goes to VeriFactu: without a live
        activation the answer is not ready, with `COMPANY_NOT_ACTIVATED`.

        On top of that, the evaluation inherits the company's own VeriFactu intent: the
        VeriFactu capability chain (AEAT census, signed representation) is only required
        when the company applies VeriFactu by default (its `apply_by_default` setting in
        this environment; absent means `false`) — the same derivation invoice creation
        uses when `verifactu_enabled` is omitted. A company with VeriFactu off is `ready`
        with a NIF, a default series and a live activation, even if its NIF is not in the
        census. Issuing a specific invoice WITH `verifactu_enabled: true` still enforces
        the full chain at emission time regardless of this answer.

        `ready` is `true` only when there are no `blockers`. Each blocker is a stable
        code:

        * `COMPANY_HAS_NO_NIF` — the company has no NIF yet (empty/provisioned shell).
        * `SERIES_DEFAULT_NOT_FOUND` — there is no default invoice series.
        * `COMPANY_NOT_ACTIVATED` — the company is not activated in this environment, so
          it cannot issue fiscal documents there at all (VeriFactu aside).
        * `ENV_MISMATCH` — VeriFactu is intended but the NIF is not activated in the
          target environment (e.g. set up only in TEST while issuing in production).
        * `NIF_NOT_REGISTERED` — VeriFactu is intended but the NIF is not yet activated
          in the AEAT census for that environment.
        * `NIF_REPRESENTATION_REQUIRED` — production VeriFactu emission needs a signed
          AEAT representation, which is not yet in place.

        This does NOT cover the payer account's quota/subscription (a separate, global
        concern) nor the validity of a specific invoice's payload.
      tags:
        - Company
      responses:
        '200':
          description: Issuing readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuingReadinessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/accounts/{account_id}/companies/{company_id}/representation/generate:
    parameters:
      - name: account_id
