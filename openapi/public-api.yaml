          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Members
      summary: Change a member's account role
      description: Changes the account role of a member. Requires OWNER/ADMIN. `OWNER` is not an assignable value here — an account has exactly one owner, and ownership is handed over only through `PUT /v1/accounts/{account_id}/owner`, which promotes the new owner and steps the current one down in the same operation. Cannot demote the last OWNER of the account.
      operationId: patchAccountMember
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - members:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
