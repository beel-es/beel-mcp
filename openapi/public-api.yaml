                          - sent_to
                          - sent_at
                          - total_invoices
                          - invoices_attached
                        properties:
                          email_id:
                            $ref: '#/components/schemas/UUID'
                          sent_to:
                            type: array
                            items:
                              $ref: '#/components/schemas/Email'
                          sent_at:
                            type: string
                            format: date-time
                          total_invoices:
                            type: integer
                            description: Total number of requested invoices
                          invoices_attached:
                            type: integer
                            description: Number of PDFs successfully attached
                          failures:
                            type: array
                            description: List of invoices that could not be attached
                            items:
                              type: object
                              properties:
                                invoice_id:
                                  $ref: '#/components/schemas/UUID'
                                error_code:
                                  type: string
                                  enum:
                                    - NOT_FOUND
                                    - PDF_NOT_GENERATED
                                    - INVALID_STATE
                                    - INTERNAL_ERROR
                                error_message:
                                  type: string
        '400':
