  /v1/customers/import-csv-preview:
    post:
      tags:
        - Customer Import
      summary: Import customers from CSV with structured preview
      description: |
        **Deprecated.** Use `POST /v1/companies/{company_id}/customers/imports/preview`, which parses and
        validates the file without writing anything — what this route does by default. To actually
        import, use `POST /v1/companies/{company_id}/customers/imports`: a boolean no longer decides between looking and
        writing. The origin of the file travels in the body as `source`.
        This route keeps working until the date announced in its `Sunset` response header.

        Imports multiple customers from a CSV file with full preview of all records.

        **Key features**:
        - **Structured preview**: Returns all parsed records (valid and with errors)
        - **Parallel validation**: NIFs validated concurrently against VeriFactu
        - **Granular feedback**: Customer-specific errors and warnings
        - **Editable data**: Structured JSON for editable table in frontend

        **Recommended flow**:
        1. **Initial upload**: Call with `dry_run=true` to get preview
        2. **Display table**: Frontend shows parsed data with errors/warnings
        3. **Inline editing**: User corrects data directly in the table
        4. **Final import**: Send corrected data with `dry_run=false`

        **Format**: Must follow CSV template format (downloadable from `/v1/customers/templates/csv`).

        **Security limits**:
        - Max size: 5MB
        - Max 1,000 records per file

        **Validation**:
        - Required headers per template
        - Full validation of each row with business rules
        - Parallel NIF validation against AEAT registry (VeriFactu)
        - Duplicate detection in CSV and database

        **Validation statuses**:
        - `VALID`: Customer valid, ready to import
        - `WARNING`: Customer valid but with warnings (eg: missing email)
        - `ERROR`: Customer invalid, cannot process
        - `DUPLICATE`: Duplicate customer (in CSV or DB)
        - `NIF_INVALID`: NIF invalid in AEAT registry
      operationId: importCustomersCsvPreview
      x-successor:
        method: POST
        path: /v1/companies/{company_id}/customers/imports/preview
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - customers:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with customers to import
                dry_run:
                  type: boolean
                  default: true
                  description: |
                    If true (recommended initially): preview only without persistence.
                    If false: preview + persistence of valid customers.
      responses:
        '200':
          description: CSV processing completed with structured preview using unified format
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerValidationUnifiedResult'
        '400':
          description: |
            Invalid file for one of the following reasons:
            - Format is not valid CSV
            - Encoding is not UTF-8
            - Required headers missing
            - Size exceeds 5MB
            - More than 1,000 records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          details:
                            type: object
                            properties:
                              file_size_mb:
                                type: number
                                description: File size in MB
                              record_count:
                                type: integer
                                description: Number of records found
                              missing_headers:
                                type: array
                                items:
                                  type: string
                                description: Required headers that are missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File too large (>5MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Structural CSV validation error (corrupted format, invalid encoding)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/customers/import-holded-contacts:
    post:
      tags:
        - Customer Import
      summary: Import contacts from Holded Excel
      description: |
        **Deprecated.** Use `POST /v1/companies/{company_id}/customers/imports` with `source: holded`, which
        imports the same file. It answers `201` and requires the `Idempotency-Key` header.
        This route keeps working until the date announced in its `Sunset` response header.

        Imports multiple customers from an Excel file exported from Holded.

        **Key features**:
        - **Specific parsing**: Reads exact structure of Holded contacts Excel (29 columns)
        - **Automatic mapping**: Converts Holded contacts to Customer entities automatically
        - **Full validation**: Validates NIFs, addresses and required data
        - **Preview mode**: Allows viewing parsed data before importing

        **Recommended flow**:
        1. **Initial upload**: Call with `preview=true` to get preview
        2. **Display data**: Frontend shows parsed Holded contacts
        3. **Final import**: Call with `preview=false` to import definitively

        **Expected Excel structure** (contacts exported from Holded):
        - Sheet: "Holded"
        - Rows to skip: 2 (header + empty)
        - Headers in row 2: Created, Name, ID, Email, Phone, Mobile, etc. (29 columns)
        - Footer: "Report created automatically with Holded..."

        **Security limits**:
        - Max size: 10MB
        - Max 5,000 records per file

        **Automatic Holded → Customer mapping**:
        - Name → legal_name
        - ID → identifier (NIF/CIF)
        - Email → email
        - Phone/Mobile → phone (prioritizes mobile)
        - Full address → address
        - Tags → notes
      operationId: importHoldedContacts
      x-successor:
        method: POST
        path: /v1/companies/{company_id}/customers/imports
      deprecated: true
      security:
        - ApiKeyAuth: []
        - OAuth2:
            - customers:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file (.xlsx) of contacts exported from Holded
                preview:
                  type: boolean
                  default: true
                  description: |
                    If true: parsing and mapping only without importing to DB.
                    If false: parsing + mapping + actual import.
      responses:
        '200':
          description: |
            Holded Excel processing completed with unified format.
            Returns parsed, validated and mapped customers using the same format as CSV import.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerValidationUnifiedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File too large (>10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
