  /v1/nif/validate:
    post:
      tags:
        - NIF
      summary: Validate NIF against AEAT registry
      description: |
        **Public endpoint** to validate a NIF/CIF against the AEAT registry using VeriFactu.

        This endpoint is useful for:
        - Pre-validation before registration (proactive feedback)
        - Validating customer NIFs before creating invoices
        - Verifying that a NIF exists in the registry

        **Behavior:**
        - **VALID**: The NIF exists in the AEAT registry. Returns the fiscal name.
        - **INVALID**: The NIF has correct format but doesn't exist in the registry.
        - **PENDING**: VeriFactu API is temporarily unavailable. The NIF has valid syntax but couldn't be verified against the registry.
        - **ERROR**: Technical error during validation (invalid syntax, timeout, etc.)

        **Note about PENDING:**
        If you use this endpoint for pre-validation during registration, a PENDING status
        indicates that the NIF has valid format and the user can continue. The system
        will validate the NIF automatically when the service becomes available.

        **Rate limiting:**
        - With API Key: 100 requests/hour
        - With Session Cookie: 1000 requests/hour

        **Authentication:**
        This endpoint accepts both API Keys and Session Cookies.
      operationId: validateNif
      security:
        - ApiKeyAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateNifRequest'
            example:
              nif: B12345678
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ValidateNifResponse'
              examples:
                valid:
                  summary: Valid NIF (exists in AEAT registry)
                  value:
                    success: true
                    data:
                      valid: true
                      status: VALID
                      legal_name: JUAN PEREZ GARCIA
                      message: NIF successfully validated in AEAT registry
                      validated_at: '2025-01-15T10:30:00Z'
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                invalid:
                  summary: Invalid NIF (not in AEAT registry)
                  value:
                    success: true
                    data:
                      valid: false
                      status: INVALID
                      legal_name: null
                      message: NIF does not exist in AEAT registry
                      validated_at: null
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
                pending:
                  summary: VeriFactu API unavailable (validation pending)
                  value:
                    success: true
                    data:
                      valid: false
                      status: PENDING
                      legal_name: null
                      message: NIF validation is pending. The system will validate it automatically when the service is available.
                      validated_at: null
                    meta:
                      timestamp: '2025-01-15T10:30:00Z'
                      request_id: 123e4567-e89b-12d3-a456-426614174000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
