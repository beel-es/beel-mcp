    InvalidJsonFormat:
      description: |
        Invalid JSON format — a field has a wrong type or format (e.g. invalid date, unknown enum value, malformed UUID).
        The `details` object contains `field`, `invalid_value`, and optionally `expected_format` or `allowed_values`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  error:
                    allOf:
                      - $ref: '#/components/schemas/ErrorDetail'
                      - type: object
                        properties:
                          details:
                            $ref: '#/components/schemas/FieldDeserializationError'
          example:
            success: false
            error:
              code: INVALID_JSON_FORMAT
              message: 'The field ''due_date'' has an invalid date format: ''2026-03-04fds''. Expected format: YYYY-MM-DD.'
              details:
                field: due_date
                invalid_value: 2026-03-04fds
                expected_format: YYYY-MM-DD
            meta:
              timestamp: '2026-03-05T10:30:00Z'
              request_id: 4bf92f3577b34da6a3ce929d0e0e4736
