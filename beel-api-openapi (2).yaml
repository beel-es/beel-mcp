          $ref: '#/components/schemas/ResponseMeta'
    ListCompanyApiKeys200Response:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyApiKeyData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    FieldDeserializationError:
      type: object
      required:
        - field
        - invalid_value
      properties:
        field:
          type: string
          description: JSON field name that caused the error (matches the API contract name)
          example: due_date
        invalid_value:
          type: string
          description: The value that was rejected
          example: 2026-03-04fds
        expected_format:
          type: string
          nullable: true
          description: Expected format hint (e.g. YYYY-MM-DD for dates)
          example: YYYY-MM-DD
        allowed_values:
          type: string
          nullable: true
          description: Comma-separated list of allowed values (for enum fields)
          example: STANDARD, SIMPLIFIED, CORRECTIVE
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    WebhookEventTypeEnum:
      type: string
      description: |
        Available webhook event types:
        - `invoice.emitted` — Invoice emitted and finalized
        - `invoice.email.sent` — Invoice sent by email
        - `invoice.cancelled` — Invoice cancelled
        - `verifactu.status.updated` — VeriFactu status changed (PENDING, ACCEPTED, REJECTED)
      enum:
        - invoice.emitted
        - invoice.email.sent
        - invoice.cancelled
        - verifactu.status.updated
    CreateWebhookSubscriptionRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint URL that will receive webhook POST requests.
          example: https://yourapp.com/webhooks/beel
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventTypeEnum'
          description: List of event types to subscribe to.
          example:
            - invoice.emitted
            - verifactu.status.updated
    WebhookSubscriptionWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            secret:
              type: string
              description: |
                HMAC-SHA256 signing secret. **Only returned on creation and secret rotation.**
                Store it securely — it cannot be retrieved again.
              example: whsec_a3f5b2e1c9d8f7e6b5a4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2
    WebhookEventDataInvoiceEmitted:
      type: object
      description: Data payload for `invoice.emitted` events.
      additionalProperties: false
      required:
        - invoice_id
        - invoice_number
      properties:
        invoice_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          example: 2025/0001
        customer_email:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
    WebhookEventDataInvoiceEmailSent:
      type: object
      description: Data payload for `invoice.email.sent` events.
      additionalProperties: false
      required:
        - invoice_id
        - all_recipients
        - sent_at
      properties:
        invoice_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          nullable: true
          example: 2025/0001
        all_recipients:
          type: array
          items:
            type: string
          description: All email recipients (TO + CC).
        sent_at:
          type: string
          format: date-time
    WebhookEventDataInvoiceCancelled:
      type: object
      description: Data payload for `invoice.cancelled` events.
      additionalProperties: false
      required:
        - invoice_id
        - invoice_number
      properties:
        invoice_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          example: 2025/0001
        cancellation_reason:
          type: string
          nullable: true
    WebhookEventDataVeriFactuStatusUpdated:
      type: object
      description: Data payload for `verifactu.status.updated` events.
      additionalProperties: false
      required:
        - invoice_id
        - verifactu_registration_id
        - previous_status
        - new_status
      properties:
        invoice_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          nullable: true
          example: 2025-001
        verifactu_registration_id:
          type: string
          format: uuid
        previous_status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
        new_status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
        qr_url:
          type: string
          nullable: true
          example: https://sede.agenciatributaria.gob.es/Sede/verifactu?id=ABC123
        qr_base64:
          type: string
          nullable: true
          description: QR code as base64-encoded PNG for embedding in PDFs.
        invoice_hash:
          type: string
          nullable: true
          example: B11F3A015173AD99075E2720F61E2DE1FF08CBFEDD85C6F73C77AD835301B2A3
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
    WebhookEvent:
      type: object
      description: Payload delivered to your endpoint on every webhook event.
      properties:
        id:
          type: string
          description: Unique webhook event ID (UUID).
          example: 3f7a1b2c-4d5e-6f7a-8b9c-0d1e2f3a4b5c
        type:
          $ref: '#/components/schemas/WebhookEventTypeEnum'
        created_at:
          type: string
          format: date-time
        api_version:
          type: string
          example: 2025-01
        livemode:
          type: boolean
          description: '`false` for SANDBOX API keys.'
        test:
          type: boolean
          nullable: true
          description: '`true` only for test deliveries triggered from the dashboard.'
        data:
          oneOf:
            - $ref: '#/components/schemas/WebhookEventDataInvoiceEmitted'
            - $ref: '#/components/schemas/WebhookEventDataInvoiceEmailSent'
            - $ref: '#/components/schemas/WebhookEventDataInvoiceCancelled'
            - $ref: '#/components/schemas/WebhookEventDataVeriFactuStatusUpdated'
    UpdateWebhookSubscriptionRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: New HTTPS endpoint URL.
          example: https://yourapp.com/webhooks/beel
        events:
          type: array
          nullable: true
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventTypeEnum'
          description: New list of event types to subscribe to.
        active:
          type: boolean
          nullable: true
          description: Enable or disable the webhook subscription.
    WebhookDeliveryLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        webhook_event_id:
          type: string
          format: uuid
          description: Groups all delivery attempts for the same logical event.
        event_type:
          type: string
          example: verifactu.status.updated
        attempt_number:
          type: integer
          description: Delivery attempt number (1 = first, 2 = first retry, etc.)
        http_status:
          type: integer
          nullable: true
          description: HTTP response status code. Null if connection failed.
          example: 200
        response_body:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
          description: Delivery duration in milliseconds.
        success:
          type: boolean
        error_message:
          type: string
          nullable: true
          description: Error description for failed deliveries (timeout, connection error, etc.)
        payload:
          type: string
          nullable: true
          description: The JSON payload that was sent (or attempted) to your endpoint.
        request_headers:
          type: object
          nullable: true
          description: |
            HTTP headers sent to your endpoint with this delivery attempt.
            Includes `BeeL-Signature`, `BeeL-Event`, `BeeL-Event-Id`, `BeeL-Delivery-Id`, and `Idempotency-Key`.
          additionalProperties:
            type: string
          example:
            BeeL-Signature: t=1741362026,v1=3c4f7a2e1b9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f
            BeeL-Event: verifactu.status.updated
            BeeL-Event-Id: 8ee6b023-c4e5-482e-93ca-dc66da2f9cb5
            BeeL-Delivery-Id: b3873959-67d8-4a11-87ba-b39cc2d395fe
            Idempotency-Key: 8ee6b023-c4e5-482e-93ca-dc66da2f9cb5
        delivered_at:
          type: string
          format: date-time
    schemas-TaxRegime:
      type: string
      enum:
        - IVA
        - IGIC
        - IPSI
        - OTHER
      description: |
        Applicable tax regime:
        - IVA: Value Added Tax (Iberian Peninsula and Balearic Islands)
        - IGIC: Canary Islands General Indirect Tax (Canary Islands)
        - IPSI: Production, Services and Import Tax (Ceuta and Melilla)
        - OTHER: Special regimes (exemptions, etc.)
      example: IVA
    VatPercentage:
      type: integer
      enum:
        - 0
        - 4
        - 10
        - 21
      description: |
        VAT percentage in integer format.
        Allowed values: 0 (exempt), 4 (super-reduced), 10 (reduced), 21 (standard).
        Valid values are validated according to the configured tax regime.
      example: 21
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: beel_sk_*
      description: |
        API Key authentication.

        **Format:** `Authorization: Bearer beel_sk_<key>`

        **Obtaining Keys:** API Keys are managed from the BeeL dashboard

        **Security:** API Keys are secret credentials. Do not share them or store them in source code
    SessionCookie:
      type: apiKey
      in: cookie
      name: BEEL_SESSION
      description: |
        Session Cookie authentication (for browser-based access).

        **Note:** This method is primarily used by the web application.
        For programmatic access, use API Keys instead.
