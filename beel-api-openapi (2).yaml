  /v1/customers/import-holded-contacts:
    post:
      tags:
        - Customer Import
      summary: Import contacts from Holded Excel
      description: |
        Imports multiple customers from an Excel file exported from Holded.

        **Key features**:
        - **Specific parsing**: Reads exact structure of Holded contacts Excel (29 columns)
        - **Automatic mapping**: Converts Holded contacts to Customer entities automatically
        - **Full validation**: Validates NIFs, addresses and required data
        - **Preview mode**: Allows viewing parsed data before importing

        **Recommended flow**:
        1. **Initial upload**: Call with `preview=true` to get preview
        2. **Display data**: Frontend shows parsed Holded contacts
        3. **Final import**: Call with `preview=false` to import definitively

        **Expected Excel structure** (contacts exported from Holded):
        - Sheet: "Holded"
        - Rows to skip: 2 (header + empty)
        - Headers in row 2: Created, Name, ID, Email, Phone, Mobile, etc. (29 columns)
        - Footer: "Report created automatically with Holded..."

        **Security limits**:
        - Max size: 10MB
        - Max 5,000 records per file
        - Rate limiting: 5 imports per hour

        **Automatic Holded → Customer mapping**:
        - Name → legal_name
        - ID → identifier (NIF/CIF)
        - Email → email
        - Phone/Mobile → phone (prioritizes mobile)
        - Full address → address
        - Tags → notes
      operationId: importHoldedContacts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel file (.xlsx) of contacts exported from Holded
                preview:
                  type: boolean
                  default: true
                  description: |
                    If true: parsing and mapping only without importing to DB.
                    If false: parsing + mapping + actual import.
      responses:
        '200':
          description: |
            Holded Excel processing completed with unified format.
            Returns parsed, validated and mapped customers using the same format as CSV import.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerValidationUnifiedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large (>10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Rate limit exceeded (maximum 5 imports per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/customers/templates/csv:
    post:
      tags:
        - Customer Templates
      summary: Download CSV template for customers
      description: |
        Downloads a sample CSV file for customer import.

        **Format**: The file includes the required headers and example rows
        with UTF-8 BOM for Excel compatibility.
      operationId: downloadCustomerTemplateCsv
      responses:
        '200':
          description: CSV template downloaded successfully
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: |
                nombre_fiscal;nif;email;telefono;direccion_calle;direccion_numero;direccion_codigo_postal;direccion_poblacion;direccion_provincia
                "Construcciones García y Asociados SL";B12345678;contacto@construccionesgarcia.es;915551234;"Calle Gran Vía";45;28013;Madrid;Madrid
          headers:
            Content-Disposition:
              description: File name for download
              schema:
                type: string
                example: attachment; filename="template_clientes_beel.csv"
            Content-Type:
              description: File MIME type
              schema:
                type: string
                example: text/csv; charset=utf-8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
