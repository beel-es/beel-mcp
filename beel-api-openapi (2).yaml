  /v1/invoices/{invoice_id}/void:
    post:
      tags:
        - InvoiceLifecycle
      summary: Void invoice
      description: |
        Voids an invoice by changing its status to `VOIDED`.

        **Status change:** `ISSUED`, `SENT`, `OVERDUE`, `PAID` or `RECTIFIED` → `VOIDED`

        **Use when:** The operation never took place (invoice issued by mistake, duplicate, etc.)
        For invoices already submitted to VeriFactu, the cancellation is sent to AEAT automatically.

        **Note:** If the operation did take place but with errors, use the corrective invoice endpoint instead.
      operationId: voidInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          description: Invoice ID
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Void reason (minimum 10 characters)
                  example: Invoice issued with incorrect customer data
                void_date:
                  type: string
                  format: date
                  description: Void date (defaults to today)
                  example: '2025-01-20'
      responses:
        '200':
          description: Invoice voided successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Cannot void invoice (invalid status or incorrect data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/invoices/{invoice_id}/corrective:
    post:
      tags:
        - InvoiceLifecycle
      summary: Create corrective invoice
      description: |
        Creates a corrective invoice to correct or void an issued invoice.

        **Rectification types:**
        - **TOTAL**: Completely voids the original invoice (original status → VOIDED)
        - **PARTIAL**: Partially corrects the original invoice (original status → RECTIFIED)

        **VeriFactu codes:**
        - R1: Legal error and Art. 80 One, Two and Six LIVA
        - R2: Article 80 Three LIVA (Bankruptcy)
        - R3: Article 80 Four LIVA (Bad debts)
        - R4: Other causes
        - R5: Simplified invoices (only for simplified)

        **Validations:**
        - Original invoice must be in status ISSUED, SENT, PAID, OVERDUE or RECTIFIED
        - Cannot rectify a DRAFT invoice (must be issued first)
        - Cannot rectify a VOIDED invoice (final status)
        - For TOTAL rectification: Another total corrective cannot already exist
        - For PARTIAL rectification: Multiple partial correctives are allowed

        **Lines:**
        - TOTAL: Optional (if not provided, original lines are copied with negated amounts)
        - PARTIAL: REQUIRED (adjustment lines with positive or negative amounts)
      operationId: createCorrectiveInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          description: Invoice ID to rectify
          schema:
            $ref: '#/components/schemas/UUID'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCorrectiveInvoiceRequest'
            examples:
              corrective_total_r1:
                $ref: '#/components/examples/corrective-total-r1'
              corrective_total_r4:
                $ref: '#/components/examples/corrective-total-r4'
              corrective_partial_r2:
                $ref: '#/components/examples/corrective-partial-r2'
              corrective_partial_r3:
                $ref: '#/components/examples/corrective-partial-r3'
      responses:
        '201':
          description: Corrective invoice created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid rectification data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Original invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A total corrective invoice already exists for this invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Original invoice cannot be rectified (invalid status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/invoices/{invoice_id}/issue:
    post:
      tags:
        - InvoiceLifecycle
      summary: Issue invoice (DRAFT → ISSUED)
      description: |
        Finalizes a draft invoice and marks it as issued.

        **Status change:** `DRAFT` → `ISSUED`

        **Actions performed:**
        - Assigns definitive invoice number according to configured series
        - Marks invoice as finalized (not modifiable)
        - Prepares invoice for sending to customer

        **Validations:**
        - Invoice must be in DRAFT status
        - All invoice data must be complete and valid

        **Note:** After issuing, the invoice can be sent to the customer via
        the `/invoices/{id}/send` endpoint
      operationId: issueInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          description: Invoice ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: wait_for_pdf
          in: query
          required: false
          description: |
            If `true`, waits for PDF generation and returns the URL in the response.
            Adds ~1-2s latency but guarantees PDF is immediately available.
            If `false` (default), PDF is generated asynchronously.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Invoice issued successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Cannot issue invoice (invalid status or incomplete data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invoice cannot be issued (validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/invoices/{invoice_id}/mark-sent:
    post:
      tags:
