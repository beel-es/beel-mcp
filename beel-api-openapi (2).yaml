    CsvImportResult:
      type: object
      required:
        - total_processed
        - successful
        - failed
        - duplicates_skipped
      properties:
        total_processed:
          type: integer
          minimum: 0
          description: Total records processed from CSV
          example: 150
        successful:
          type: integer
          minimum: 0
          description: Number of customers successfully created
          example: 145
        failed:
          type: integer
          minimum: 0
          description: Number of records that failed
          example: 5
        duplicates_skipped:
          type: integer
          minimum: 0
          description: Number of records skipped as duplicates (same Tax ID)
          example: 3
        created_customers:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
          description: List of successfully created customers
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CsvValidationError'
          description: Error details by row
        warnings:
          type: array
          items:
            type: string
          description: Non-critical warnings (missing optional fields)
          example:
            - 'Row 2: Email not provided for customer ''TechSolutions Barcelona SA'''
            - 'Row 5: Invalid phone number for customer ''María López Fernández'''
    CsvValidationError:
      type: object
      required:
        - row
        - field
        - value
        - error
      properties:
        row:
          type: integer
          minimum: 1
          description: Row number with error (1-based, excluding header)
          example: 12
        field:
          type: string
          description: Field name with error
          example: nif
        value:
          type: string
          description: Value that caused the error
          example: 12345678X
        error:
          type: string
          description: Detailed error message
          example: 'Invalid Tax ID: incorrect format'
    TemplateCsvInfo:
      type: object
      required:
        - filename
        - headers
        - example_rows
      properties:
        filename:
          type: string
          description: Template file name
          example: template_customers_example.csv
        headers:
          type: array
          items:
            type: string
          description: Required CSV headers
          example:
            - legal_name
            - nif
            - email
            - phone
            - address_street
            - address_number
            - address_postal_code
            - address_city
            - address_province
        example_rows:
          type: integer
          description: Number of example rows in the template
          example: 4
        max_records:
          type: integer
          description: Maximum number of allowed records
          example: 1000
        max_file_size_mb:
          type: number
          description: Maximum file size in MB
          example: 5
    CsvImportPreviewResult:
      type: object
      required:
        - metadata
        - customers_preview
        - statistics
      description: |
        Complete result of a CSV import with structured preview.
        Contains all parsed records, statistics and processing metadata.
      properties:
        metadata:
          $ref: '#/components/schemas/CsvImportMetadata'
        customers_preview:
          type: array
          items:
            $ref: '#/components/schemas/CsvCustomerPreview'
          description: Complete list of parsed customers with their validation status
        statistics:
          $ref: '#/components/schemas/CsvImportStatistics'
    CsvImportMetadata:
      type: object
      required:
        - filename
        - file_size_bytes
        - total_rows
        - is_dry_run
        - processing_time_ms
      description: Metadata about the processed CSV file
      properties:
        filename:
          type: string
          description: Original file name
          example: customers_january.csv
        file_size_bytes:
          type: integer
          description: File size in bytes
          example: 1048576
        total_rows:
          type: integer
          description: Total rows processed (excluding headers)
          example: 250
        is_dry_run:
          type: boolean
          description: Whether it was a test processing without persistence
          example: true
        processing_time_ms:
          type: integer
          description: Processing time in milliseconds
          example: 3450
    CsvCustomerPreview:
      type: object
      required:
        - row_number
        - customer
        - status
        - errors
        - warnings
      description: |
        Preview of an individual customer parsed from CSV.
        Includes the parsed customer, validation status and specific errors/warnings.
      properties:
        row_number:
          type: integer
          description: Row number in CSV (starting from 1)
          example: 15
        customer:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Customer'
          description: Parsed customer (null if there are critical parsing errors)
        status:
          $ref: '#/components/schemas/ValidationStatus'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CsvValidationError'
          description: List of validation errors for this customer
        warnings:
          type: array
          items:
            type: string
          description: List of warnings (customer processable but with observations)
          example:
            - 'Row 15: Email not provided for customer ''Empresa ABC'''
    ValidationStatus:
      type: string
      enum:
        - VALID
        - WARNING
        - ERROR
        - DUPLICATE
        - NIF_INVALID
      description: |
        Validation status of the parsed customer:
        - VALID: Valid customer, ready to import
        - WARNING: Valid customer but with non-critical warnings
        - ERROR: Invalid customer, cannot be processed
        - DUPLICATE: Duplicate customer (in CSV or database)
        - NIF_INVALID: Tax ID not valid according to AEAT registry (VeriFactu)
    CsvImportStatistics:
      type: object
      required:
        - total_processed
        - successful
        - with_warnings
        - failed
        - duplicates
        - invalid_nifs
        - success_rate
      description: Calculated statistics from CSV processing
      properties:
        total_processed:
          type: integer
          description: Total records processed
          example: 250
        successful:
          type: integer
          description: Valid customers without warnings
          example: 180
        with_warnings:
          type: integer
          description: Valid customers but with warnings
          example: 45
        failed:
          type: integer
          description: Customers with validation errors
          example: 15
        duplicates:
          type: integer
          description: Duplicate customers (in CSV or DB)
          example: 8
        invalid_nifs:
          type: integer
          description: Customers with invalid Tax IDs in AEAT
          example: 2
        success_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Success rate (successful + with_warnings) / total
          example: 0.9
